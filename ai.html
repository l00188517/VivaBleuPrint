<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gemini AI Chat</title>
    <style>
        :root {
            --bg-color: #f4f7f6;
            --chat-bg: #ffffff;
            --user-msg: #007bff;
            --ai-msg: #e9ecef;
            --text-color: #333;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .chat-container {
            width: 100%;
            max-width: 600px;
            height: 80vh;
            background: var(--chat-bg);
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .header {
            padding: 20px;
            background: #007bff;
            color: white;
            text-align: center;
            font-weight: bold;
            font-size: 1.2rem;
        }

        #chat-box {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .message {
            max-width: 80%;
            padding: 12px 16px;
            border-radius: 18px;
            font-size: 0.95rem;
            line-height: 1.4;
        }

        .user-message {
            align-self: flex-end;
            background-color: var(--user-msg);
            color: white;
            border-bottom-right-radius: 4px;
        }

        .ai-message {
            align-self: flex-start;
            background-color: var(--ai-msg);
            color: var(--text-color);
            border-bottom-left-radius: 4px;
            white-space: pre-wrap;
        }

        .input-area {
            padding: 20px;
            border-top: 1px solid #eee;
            display: flex;
            gap: 10px;
        }

        input[type="text"] {
            flex: 1;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 25px;
            outline: none;
        }

        button {
            padding: 10px 20px;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            transition: background 0.3s;
        }

        button:hover {
            background: #0056b3;
        }

        .typing-indicator {
            font-size: 0.8rem;
            color: #888;
            margin-bottom: 10px;
            display: none;
        }
    </style>
</head>
<body>

<div class="chat-container">
    <div class="header">Gemini AI Assistant</div>
    
    <!-- API Key Input (Simple way to keep it out of code) -->
    <div style="padding: 10px; background: #fffde7; font-size: 0.8rem; text-align: center; border-bottom: 1px solid #eee;">
        <input type="password" id="api-key" placeholder="Enter your Gemini API Key" style="width: 80%; padding: 5px;">
    </div>

    <div id="chat-box">
        <div class="message ai-message">Hello! How can I help you today?</div>
    </div>
    
    <div id="loading" class="typing-indicator" style="padding: 0 20px;">Gemini is thinking...</div>

    <div class="input-area">
        <input type="text" id="user-input" placeholder="Type a message..." autocomplete="off">
        <button onclick="sendMessage()">Send</button>
    </div>
</div>

<script>
    const chatBox = document.getElementById('chat-box');
    const userInput = document.getElementById('user-input');
    const apiKeyInput = document.getElementById('api-key');
    const loadingIndicator = document.getElementById('loading');

    async function sendMessage() {
        const text = userInput.value.trim();
        const apiKey = apiKeyInput.value.trim();

        if (!text) return;
        if (!apiKey) {
            alert("Please enter your API Key first!");
            return;
        }

        // 1. Add User Message to UI
        appendMessage(text, 'user-message');
        userInput.value = '';
        loadingIndicator.style.display = 'block';

        try {
            // 2. Call Gemini API
            // Using the 'gemini-1.5-flash' model for speed
            const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=${apiKey}`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({
                    contents: [{
                        parts: [{ text: text }]
                    }],
                    systemInstruction: {
                        parts: [{ text: "You are a professional Career Architect. Based on the user's preferences, provide a detailed career roadmap. Include suggested job titles, top 3 skills to learn, and a brief 3-step action plan. Use Markdown for formatting. Keep it inspiring and professional." }]
                    }
                })
            });

            const data = await response.json();
            
            // 3. Extract and display the AI's response
            if (data.candidates && data.candidates[0].content.parts[0].text) {
                const aiResponse = data.candidates[0].content.parts[0].text;
                appendMessage(aiResponse, 'ai-message');
            } else {
                appendMessage("Error: Could not retrieve response. Check your API key.", 'ai-message');
            }

        } catch (error) {
            console.error("Error calling Gemini API:", error);
            appendMessage("Error: Network issue or invalid request.", 'ai-message');
        } finally {
            loadingIndicator.style.display = 'none';
            chatBox.scrollTop = chatBox.scrollHeight;
        }
    }

    function appendMessage(text, className) {
        const msgDiv = document.createElement('div');
        msgDiv.className = `message ${className}`;
        msgDiv.textContent = text;
        chatBox.appendChild(msgDiv);
        chatBox.scrollTop = chatBox.scrollHeight;
    }

    // Allow pressing "Enter" to send
    userInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') sendMessage();
    });
</script>

</body>
</html>
