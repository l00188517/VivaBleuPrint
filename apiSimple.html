<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Viva Gemini Career Architect</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script type="importmap">
        {
            "imports": {
                "@google/generative-ai": "https://esm.run/@google/generative-ai"
            }
        }
    </script>
    <style>
        .step-transition { transition: all 0.3s ease-in-out; }
        .hidden { display: none; }
        .spinner { animation: spin 1s linear infinite; }
        @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    </style>
</head>
<body class="bg-slate-50 min-h-screen font-sans">

    <div id="app" class="flex flex-col items-center justify-center min-h-screen p-4">
        <!-- Progress Bar Container -->
        <div id="progress-container" class="max-w-xl w-full mb-8 flex items-center gap-2">
            <!-- Progress dots generated by JS -->
        </div>

        <!-- Question Card -->
        <div id="question-card" class="max-w-xl w-full bg-white rounded-3xl shadow-lg border border-slate-200 p-8 md:p-10">
            <div id="step-indicator" class="inline-block px-3 py-1 bg-indigo-50 text-indigo-600 rounded-full text-xs font-bold uppercase mb-4"></div>
            <h2 id="question-text" class="text-2xl font-bold text-slate-900 mb-2"></h2>
            <p id="question-subtitle" class="text-slate-500 mb-6"></p>

            <div id="options-container" class="space-y-3 mb-8">
                <!-- Options generated by JS -->
            </div>

            <div id="error-message" class="mb-6 p-4 bg-red-50 text-red-600 rounded-xl text-sm border border-red-100 hidden"></div>

            <div class="flex gap-4">
                <button id="prev-btn" class="flex-1 py-4 px-6 border border-slate-200 text-slate-600 rounded-xl font-bold hover:bg-slate-50 disabled:opacity-50 hidden">Back</button>
                <button id="next-btn" class="flex- py-4 px-6 bg-indigo-600 text-white rounded-xl font-bold hover:bg-indigo-700 transition-all flex items-center justify-center disabled:bg-slate-300 disabled:cursor-not-allowed shadow-lg shadow-indigo-200">
                    <span id="next-btn-text">Next Question</span>
                    <i class="fas fa-arrow-right ml-2" id="next-btn-icon"></i>
                </button>
            </div>
        </div>
    </div>

    <script type="module">
       import { GoogleGenerativeAI } from "@google/generative-ai";
        ////import * as GoogleGenaiModule from '@google/genai';
        //console.log(GoogleGenaiModule);

        const ai = new GoogleGenerativeAI({ apiKey: "YOUR_API_KEY" });
        // Get the generative model
        const model = ai.getGenerativeModel({ model: "gemini-3-flash-preview" });

        async function main() {
            try {
                const prompt = "Explain how AI works in a few words";
                // Call generateContent on the model instance
                const result = await model.generateContent(prompt);
                const response = result.response; // Access the response property from the result
                console.log(response.text()); // Call the text() method to get the content

                /*
                const response = await ai.models.generateContent({
                    model: "gemini-3-flash-preview",
                    contents: "Explain how AI works in a few words",
                });
                console.log(response.text);*/
            } catch (error) {
                console.error("Error generating content:", error);
            }
        }

        main();
        
    </script>
</body>
</html>
