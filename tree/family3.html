<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Family Tree Builder</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; overflow: hidden; user-select: none; }
        .tree-container { width: 100vw; height: 100vh; cursor: grab; overflow: hidden; position: relative; }
        .tree-container:active { cursor: grabbing; }
        .node { cursor: move; transition: filter 0.2s ease; }
        .node:hover { filter: drop-shadow(0 10px 8px rgb(0 0 0 / 0.15)); }
        .connector { fill: none; stroke: #94a3b8; stroke-width: 2.5px; stroke-linecap: round; transition: opacity 0.3s ease; pointer-events: none; }
        .connector.spouse { stroke-dasharray: 6,4; stroke: #cbd5e1; }
        .modal-overlay { background-color: rgba(0, 0, 0, 0.4); backdrop-filter: blur(4px); }
        .profile-pic-preview { width: 80px; height: 80px; object-fit: cover; border-radius: 50%; border: 2px solid #3b82f6; }
        #toast { transition: transform 0.3s ease, opacity 0.3s ease; transform: translateY(-100%); opacity: 0; }
        #toast.show { transform: translateY(0); opacity: 1; }
        .empty-state { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); text-align: center; z-index: 5; }
        
        /* Search styling */
        .search-results { max-height: 300px; overflow-y: auto; box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1); }
    </style>
</head>
<body>

<div id="app" class="relative">
    <div id="toast" class="fixed top-20 left-1/2 -translate-x-1/2 z-50 bg-slate-800 text-white px-6 py-3 rounded-full shadow-xl text-sm font-medium pointer-events-none">
        Nothing selected
    </div>

    <header class="fixed top-0 left-0 right-0 z-10 bg-white/80 backdrop-blur-md border-b border-slate-200 px-6 py-4 flex flex-wrap gap-4 justify-between items-center">
        <div class="flex items-center gap-6">
            <h1 class="text-xl font-bold text-slate-800 flex items-center gap-2">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-blue-600"><path d="M12 2v20M2 12h20"/><path d="m17 7-5-5-5 5"/><path d="m17 17-5 5-5-5"/></svg>
                Family Archive
            </h1>

            <!-- Search Component -->
            <div class="relative w-64 md:w-80">
                <div class="relative">
                    <input 
                        type="text" 
                        id="searchInput" 
                        placeholder="Search for a member..." 
                        class="w-full pl-10 pr-4 py-2 bg-slate-100 border-none rounded-full text-sm focus:ring-2 focus:ring-blue-500 outline-none transition-all"
                        oninput="handleSearch(this.value)"
                    >
                    <svg class="absolute left-3 top-2.5 text-slate-400" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
                </div>
                <div id="searchResults" class="hidden absolute top-full left-0 right-0 mt-2 bg-white rounded-xl border border-slate-200 search-results z-50 overflow-hidden">
                    <!-- Results dynamically injected -->
                </div>
            </div>
        </div>

        <div class="flex gap-3">
            <button onclick="zoomIn()" class="p-2 bg-white border border-slate-200 rounded-lg hover:bg-slate-50 transition-all active:scale-95">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/><line x1="11" y1="8" x2="11" y2="14"/><line x1="8" y1="11" x2="14" y2="11"/></svg>
            </button>
            <button onclick="zoomOut()" class="p-2 bg-white border border-slate-200 rounded-lg hover:bg-slate-50 transition-all active:scale-95">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/><line x1="8" y1="11" x2="14" y2="11"/></svg>
            </button>
            <button onclick="resetView()" class="px-4 py-2 bg-slate-800 text-white rounded-lg hover:bg-slate-900 transition-all text-sm font-medium">Reset View</button>
        </div>
    </header>

    <div id="treeContainer" class="tree-container">
        <!-- Empty State UI -->
        <div id="emptyState" class="hidden empty-state">
            <div class="bg-white p-8 rounded-3xl shadow-2xl border border-slate-100 max-w-sm">
                <div class="w-16 h-16 bg-blue-50 text-blue-600 rounded-2xl flex items-center justify-center mx-auto mb-4">
                    <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v20M2 12h20"/><path d="m17 7-5-5-5 5"/><path d="m17 17-5 5-5-5"/></svg>
                </div>
                <h2 class="text-xl font-bold text-slate-800 mb-2">Empty Archive</h2>
                <p class="text-slate-500 text-sm mb-6">Start your family journey by adding the first member of your tree.</p>
                <button onclick="startFirstMember()" class="w-full py-3 bg-blue-600 hover:bg-blue-700 text-white rounded-xl font-bold transition-all shadow-lg shadow-blue-200 active:scale-95">
                    + Start My Tree
                </button>
            </div>
        </div>

        <svg id="treeSvg" width="100%" height="100%">
            <g id="viewport">
                <g id="connectionsLayer"></g>
                <g id="nodesLayer"></g>
            </g>
        </svg>
    </div>

    <!-- Context Menu -->
    <div id="contextMenu" class="hidden absolute z-20 bg-white shadow-2xl border border-slate-200 rounded-xl p-2 w-60">
        <button onclick="openForm('edit')" class="w-full text-left px-3 py-2 hover:bg-blue-50 hover:text-blue-700 rounded-lg flex items-center gap-2 text-slate-700 transition-colors">
            Edit Profile
        </button>
        <div class="h-px bg-slate-100 my-1"></div>
        <p class="text-[10px] font-bold text-slate-400 px-3 uppercase tracking-wider py-1">Direct Relatives</p>
        <button onclick="openForm('parent')" class="w-full text-left px-3 py-2 hover:bg-slate-50 rounded-lg text-sm text-slate-700">Add Parent</button>
        <button onclick="openForm('spouse')" class="w-full text-left px-3 py-2 hover:bg-slate-50 rounded-lg text-sm text-slate-700">Add Spouse</button>
        <button onclick="openForm('sibling')" class="w-full text-left px-3 py-2 hover:bg-slate-50 rounded-lg text-sm text-slate-700">Add Sibling</button>
        
        <div class="h-px bg-slate-100 my-1"></div>
        <p class="text-[10px] font-bold text-slate-400 px-3 uppercase tracking-wider py-1">Children</p>
        <button onclick="openForm('child-single')" class="w-full text-left px-3 py-2 hover:bg-slate-50 rounded-lg text-sm text-slate-700">Add Single Parent Child</button>
        <button id="addChildPartnerBtn" onclick="openForm('child-partner')" class="w-full text-left px-3 py-2 hover:bg-slate-50 rounded-lg text-sm text-slate-700">Add Child with Partner</button>
        <button onclick="openForm('child-new-partner')" class="w-full text-left px-3 py-2 hover:bg-slate-50 rounded-lg text-sm text-slate-700">Add Child with New Partner</button>
        
        <div class="h-px bg-slate-100 my-1"></div>
        <button onclick="deleteNode()" class="w-full text-left px-3 py-2 hover:bg-red-50 text-red-600 rounded-lg text-sm transition-colors">Remove Member</button>
    </div>

    <!-- Form Modal -->
    <div id="modal" class="hidden fixed inset-0 z-30 modal-overlay flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl shadow-2xl w-full max-w-lg max-h-[90vh] overflow-y-auto">
            <div class="p-6 border-b border-slate-100 flex justify-between items-center sticky top-0 bg-white">
                <h2 id="modalTitle" class="text-xl font-bold text-slate-800">Member Info</h2>
                <button onclick="closeModal()" class="text-slate-400 hover:text-slate-600 transition-colors">✕</button>
            </div>
            
            <form id="memberForm" class="p-6 space-y-4">
                <div class="flex items-center gap-6 mb-4">
                    <div class="relative group">
                        <img id="imagePreview" src="https://via.placeholder.com/150" class="profile-pic-preview shadow-md" alt="Profile">
                        <label class="absolute inset-0 flex items-center justify-center bg-black/40 rounded-full opacity-0 group-hover:opacity-100 cursor-pointer">
                            <input type="file" id="photoInput" class="hidden" accept="image/*" onchange="previewImage(this)">
                            <span class="text-white text-xs">Upload</span>
                        </label>
                    </div>
                    <div class="flex-1">
                        <label class="block text-sm font-semibold text-slate-700 mb-1">Full Name</label>
                        <input type="text" id="name" required class="w-full px-4 py-2 border border-slate-200 rounded-lg outline-none">
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-semibold text-slate-700 mb-1">Gender</label>
                        <select id="gender" class="w-full px-4 py-2 border border-slate-200 rounded-lg outline-none">
                            <option value="Male">Male</option>
                            <option value="Female">Female</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-semibold text-slate-700 mb-1">Birthday</label>
                        <input type="date" id="birthday" class="w-full px-4 py-2 border border-slate-200 rounded-lg outline-none">
                    </div>
                </div>

                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-1">Profession</label>
                    <input type="text" id="profession" class="w-full px-4 py-2 border border-slate-200 rounded-lg outline-none">
                </div>

                <div class="pt-4 border-t border-slate-100 flex gap-3">
                    <button type="button" onclick="closeModal()" class="flex-1 px-4 py-2 border border-slate-200 rounded-lg">Cancel</button>
                    <button type="submit" class="flex-1 px-4 py-2 bg-blue-600 text-white rounded-lg font-medium">Save Profile</button>
                </div>
            </form>
        </div>
    </div>
</div>

<script>
    const generateId = () => 'mem_' + Math.random().toString(36).substr(2, 9);

    let nodes = [];
       /* {
            id: 'root',
            name: 'John Smith',
            gender: 'Male',
            birthday: '1985-06-15',
            profession: 'Software Engineer',
            photo: 'https://images.unsplash.com/photo-1472099645785-5658abf4ff4e?auto=format&fit=crop&q=80&w=150',
            parents: [],
            spouses: [],
            children: [],
            x: window.innerWidth / 2,
            y: window.innerHeight / 2
        }*/
    

    let selectedNodeId = null;
    let draggingNodeId = null;
    let mode = 'edit';
    let zoom = 1;
    let panX = 0;
    let panY = 0;
    let isPanning = false;
    let startMousePos = { x: 0, y: 0 };
    let lastMousePos = { x: 0, y: 0 };
    let hasMoved = false;

    const viewport = document.getElementById('viewport');
    const nodesLayer = document.getElementById('nodesLayer');
    const connectionsLayer = document.getElementById('connectionsLayer');
    const contextMenu = document.getElementById('contextMenu');
    const modal = document.getElementById('modal');
    const memberForm = document.getElementById('memberForm');
    const imagePreview = document.getElementById('imagePreview');
    const toast = document.getElementById('toast');
    const emptyState = document.getElementById('emptyState');
    const searchInput = document.getElementById('searchInput');
    const searchResults = document.getElementById('searchResults');

    window.onload = () => {
        renderTree();
        setupInputHandlers();
        window.onclick = (e) => {
            if (!contextMenu.contains(e.target)) contextMenu.classList.add('hidden');
            if (!e.target.closest('#searchInput') && !e.target.closest('#searchResults')) {
                searchResults.classList.add('hidden');
            }
        };
    };

    function showToast(message) {
        toast.textContent = message;
        toast.classList.add('show');
        setTimeout(() => toast.classList.remove('show'), 3000);
    }

    function setupInputHandlers() {
        const container = document.getElementById('treeContainer');

        container.onmousedown = (e) => {
            if (e.button !== 0) return;
            const nodeEl = e.target.closest('.node');
            
            startMousePos = { x: e.clientX, y: e.clientY };
            lastMousePos = { x: e.clientX, y: e.clientY };
            hasMoved = false;

            if (nodeEl) {
                draggingNodeId = nodeEl.getAttribute('data-id');
                selectedNodeId = draggingNodeId;
            } else {
                isPanning = true;
                selectedNodeId = null;
            }
        };

        window.onmousemove = (e) => {
            const dx_screen = e.clientX - lastMousePos.x;
            const dy_screen = e.clientY - lastMousePos.y;
            
            if (Math.abs(e.clientX - startMousePos.x) > 5 || Math.abs(e.clientY - startMousePos.y) > 5) {
                hasMoved = true;
            }

            if (draggingNodeId) {
                const node = nodes.find(n => n.id === draggingNodeId);
                if (node) {
                    node.x += dx_screen / zoom;
                    node.y += dy_screen / zoom;
                    renderTree();
                }
            } else if (isPanning) {
                panX += dx_screen;
                panY += dy_screen;
                updateTransform();
            }
            lastMousePos = { x: e.clientX, y: e.clientY };
        };

        window.onmouseup = (e) => {
            if (!hasMoved && draggingNodeId) {
                openForm('edit');
            }
            draggingNodeId = null;
            isPanning = false;
        };
    }

    // --- Search Functionality ---
    function handleSearch(query) {
        if (!query.trim()) {
            searchResults.classList.add('hidden');
            return;
        }

        const filtered = nodes.filter(n => 
            n.name.toLowerCase().includes(query.toLowerCase()) || 
            (n.profession && n.profession.toLowerCase().includes(query.toLowerCase()))
        );

        if (filtered.length > 0) {
            searchResults.innerHTML = filtered.map(n => `
                <div onclick="jumpToNode('${n.id}')" class="px-4 py-3 hover:bg-slate-50 cursor-pointer flex items-center gap-3 border-b border-slate-50 last:border-none">
                    <img src="${n.photo || 'https://via.placeholder.com/150'}" class="w-8 h-8 rounded-full object-cover">
                    <div class="flex-1">
                        <div class="text-sm font-bold text-slate-800">${n.name}</div>
                        <div class="text-[10px] text-slate-500">${n.profession || 'Family Member'}</div>
                    </div>
                    <div class="text-[10px] font-mono text-slate-300">#${n.id.substr(-4)}</div>
                </div>
            `).join('');
            searchResults.classList.remove('hidden');
        } else {
            searchResults.innerHTML = '<div class="px-4 py-3 text-sm text-slate-400">No members found</div>';
            searchResults.classList.remove('hidden');
        }
    }

    function jumpToNode(id) {
        const node = nodes.find(n => n.id === id);
        if (node) {
            // Zoom in slightly on jump
            zoom = 1.2;
            panX = (window.innerWidth / 2) - (node.x * zoom);
            panY = (window.innerHeight / 2) - (node.y * zoom);
            updateTransform();
            selectedNodeId = id;
            showToast(`Centered on ${node.name}`);
            
            // Highlight the node temporarily (via a custom CSS class or just updating)
            renderTree();
        }
        searchResults.classList.add('hidden');
        searchInput.value = '';
    }

    function findSafePosition(targetX, targetY) {
        let x = targetX;
        let y = targetY;
        while (nodes.some(n => Math.abs(n.x - x) < 50 && Math.abs(n.y - y) < 50)) {
            x += 160;
        }
        return { x, y };
    }

    function renderTree() {
        nodesLayer.innerHTML = '';
        connectionsLayer.innerHTML = '';

        if (nodes.length === 0) {
            emptyState.classList.remove('hidden');
        } else {
            emptyState.classList.add('hidden');
        }

        nodes.forEach(node => {
            // Draw Spouses
            if (node.spouses) {
                node.spouses.forEach(spouseId => {
                    const spouse = nodes.find(n => n.id === spouseId);
                    if (spouse && node.id < spouse.id) {
                        drawPath(`M ${node.x} ${node.y} L ${spouse.x} ${spouse.y}`, 'spouse');
                    }
                });
            }

            // Draw Children
            if (node.children) {
                node.children.forEach(childId => {
                    const child = nodes.find(n => n.id === childId);
                    if (!child) return;

                    const otherParentId = (child.parents || []).find(pid => pid !== node.id);
                    const otherParent = otherParentId ? nodes.find(n => n.id === otherParentId) : null;

                    if (otherParent && (node.spouses || []).includes(otherParentId)) {
                        if (node.id < otherParentId) {
                            const midX = (node.x + otherParent.x) / 2;
                            const midY = (node.y + otherParent.y) / 2;
                            const elbowY = (midY + child.y) / 2;
                            drawPath(`M ${midX} ${midY} L ${midX} ${elbowY} L ${child.x} ${elbowY} L ${child.x} ${child.y - 45}`, 'child');
                        }
                    } else {
                        // Connection for single parent or non-spouse parentage
                        const pList = child.parents || [];
                        if (pList.length <= 1 || node.id === pList) {
                            const midY = (node.y + child.y) / 2;
                            drawPath(`M ${node.x} ${node.y + 45} C ${node.x} ${midY}, ${child.x} ${midY}, ${child.x} ${child.y - 45}`, 'child');
                        }
                    }
                });
            }
        });

        nodes.forEach(node => {
            const group = document.createElementNS('http://www.w3.org/2000/svg', 'g');
            group.setAttribute('transform', `translate(${node.x - 75}, ${node.y - 45})`);
            group.setAttribute('class', 'node');
            group.setAttribute('data-id', node.id);
            
            group.oncontextmenu = (e) => {
                e.preventDefault();
                showContextMenu(e, node.id);
            };

            const rect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
            rect.setAttribute('width', '150');
            rect.setAttribute('height', '90');
            rect.setAttribute('rx', '10');
            rect.setAttribute('fill', 'white');
            // Highlight selected node
            const isSelected = node.id === selectedNodeId;
            rect.setAttribute('stroke', isSelected ? '#3b82f6' : (node.gender === 'Female' ? '#ec4899' : '#3b82f6'));
            rect.setAttribute('stroke-width', isSelected ? '4' : '2');

            const clipId = `clip-${node.id}`;
            const clip = document.createElementNS('http://www.w3.org/2000/svg', 'clipPath');
            clip.setAttribute('id', clipId);
            const circleClip = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
            circleClip.setAttribute('cx', '35');
            circleClip.setAttribute('cy', '45');
            circleClip.setAttribute('r', '25');
            clip.appendChild(circleClip);
            nodesLayer.appendChild(clip);

            const img = document.createElementNS('http://www.w3.org/2000/svg', 'image');
            img.setAttributeNS('http://www.w3.org/1999/xlink', 'href', node.photo || 'https://via.placeholder.com/150');
            img.setAttribute('x', '10');
            img.setAttribute('y', '20');
            img.setAttribute('width', '50');
            img.setAttribute('height', '50');
            img.setAttribute('clip-path', `url(#${clipId})`);
            img.setAttribute('preserveAspectRatio', 'xMidYMid slice');

            const name = document.createElementNS('http://www.w3.org/2000/svg', 'text');
            name.setAttribute('x', '70');
            name.setAttribute('y', '45');
            name.setAttribute('font-size', '12');
            name.setAttribute('font-weight', 'bold');
            name.setAttribute('class', 'select-none pointer-events-none');
            name.textContent = node.name.length > 12 ? node.name.substring(0, 10) + '..' : node.name;

            const prof = document.createElementNS('http://www.w3.org/2000/svg', 'text');
            prof.setAttribute('x', '70');
            prof.setAttribute('y', '60');
            prof.setAttribute('font-size', '10');
            prof.setAttribute('fill', '#64748b');
            prof.setAttribute('class', 'select-none pointer-events-none');
            prof.textContent = node.profession || '';

            group.appendChild(rect);
            group.appendChild(img);
            group.appendChild(name);
            group.appendChild(prof);
            nodesLayer.appendChild(group);
        });

        updateTransform();
    }

    function drawPath(d, type) {
        const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
        path.setAttribute('d', d);
        path.setAttribute('class', `connector ${type}`);
        connectionsLayer.appendChild(path);
    }

    function updateTransform() {
        viewport.setAttribute('transform', `translate(${panX}, ${panY}) scale(${zoom})`);
    }

    function showContextMenu(e, id) {
        selectedNodeId = id;
        const node = nodes.find(n => n.id === id);
        if (!node) return;
        document.getElementById('addChildPartnerBtn').style.display = (node.spouses && node.spouses.length > 0) ? 'block' : 'none';
        contextMenu.style.left = `${e.clientX}px`;
        contextMenu.style.top = `${e.clientY}px`;
        contextMenu.classList.remove('hidden');
        renderTree();
    }

    function startFirstMember() {
        selectedNodeId = null;
        openForm('create-root');
    }

    function openForm(targetMode) {
        mode = targetMode;
        contextMenu.classList.add('hidden');
        
        if (!selectedNodeId && mode !== 'create-root' && mode !== 'edit') {
            showToast("Please select a member first");
            return;
        }

        modal.classList.remove('hidden');
        const node = nodes.find(n => n.id === selectedNodeId);
        if (mode === 'edit' && node) {
            document.getElementById('name').value = node.name || '';
            document.getElementById('gender').value = node.gender || 'Male';
            document.getElementById('birthday').value = node.birthday || '';
            document.getElementById('profession').value = node.profession || '';
            imagePreview.src = node.photo || 'https://via.placeholder.com/150';
        } else {
            memberForm.reset();
            imagePreview.src = 'https://via.placeholder.com/150';
        }
    }

    function closeModal() { modal.classList.add('hidden'); }

    function previewImage(input) {
        if (input.files && input.files) {
            const reader = new FileReader();
            reader.onload = (e) => imagePreview.src = e.target.result;
            reader.readAsDataURL(input.files);
        }
    }

    memberForm.onsubmit = (e) => {
        e.preventDefault();
        const data = {
            name: document.getElementById('name').value,
            gender: document.getElementById('gender').value,
            birthday: document.getElementById('birthday').value,
            profession: document.getElementById('profession').value,
            photo: imagePreview.src
        };

        if (mode === 'edit') {
            const idx = nodes.findIndex(n => n.id === selectedNodeId);
            if (idx !== -1) nodes[idx] = { ...nodes[idx], ...data };
        } else if (mode === 'create-root') {
            const newId = generateId();
            nodes.push({
                id: newId, ...data, parents: [], children: [], spouses: [], 
                x: window.innerWidth / 2, y: window.innerHeight / 2
            });
        } else {
            const newId = generateId();
            const ref = nodes.find(n => n.id === selectedNodeId);
            if (!ref) return;

            let targetX = ref.x;
            let targetY = ref.y;

            if (mode === 'parent') targetY -= 180;
            else if (mode === 'spouse' || mode === 'sibling') targetX += 200;
            else if (mode.startsWith('child')) targetY += 180;

            const safePos = findSafePosition(targetX, targetY);
            let newNode = { id: newId, ...data, parents: [], children: [], spouses: [], x: safePos.x, y: safePos.y };

            if (mode === 'parent') {
                newNode.children.push(ref.id);
                if (!ref.parents) ref.parents = [];
                ref.parents.push(newId);
            } else if (mode === 'spouse') {
                newNode.spouses.push(ref.id);
                if (!ref.spouses) ref.spouses = [];
                ref.spouses.push(newId);
            } else if (mode === 'sibling') {
                if (!ref.parents || ref.parents.length === 0) {
                    const fatherId = generateId(), motherId = generateId();
                    nodes.push({
                        id: fatherId, name: 'Father', gender: 'Male', photo: '', spouses: [motherId], children: [ref.id, newId], parents: [],
                        x: ref.x - 100, y: ref.y - 180
                    }, {
                        id: motherId, name: 'Mother', gender: 'Female', photo: '', spouses: [fatherId], children: [ref.id, newId], parents: [],
                        x: ref.x + 100, y: ref.y - 180
                    });
                    ref.parents = [fatherId, motherId];
                    newNode.parents = [fatherId, motherId];
                } else {
                    newNode.parents = [...ref.parents];
                    newNode.parents.forEach(pid => {
                        const p = nodes.find(n => n.id === pid);
                        if (p) { if (!p.children) p.children = []; p.children.push(newId); }
                    });
                }
            } else if (mode.startsWith('child')) {
                newNode.parents.push(ref.id);
                if (!ref.children) ref.children = [];
                ref.children.push(newId);
                
                if (mode === 'child-partner' && ref.spouses && ref.spouses.length > 0) {
                    const spouseId = ref.spouses;
                    const spouse = nodes.find(n => n.id === spouseId);
                    if (spouse) {
                        newNode.parents.push(spouse.id);
                        if (!spouse.children) spouse.children = [];
                        spouse.children.push(newId);
                    }
                } else if (mode === 'child-new-partner') {
                    const spouseId = generateId();
                    const spPos = findSafePosition(ref.x + 200, ref.y);
                    nodes.push({ 
                        id: spouseId, name: 'Partner', gender: data.gender === 'Male' ? 'Female' : 'Male', spouses: [ref.id], children: [newId], parents: [],
                        x: spPos.x, y: spPos.y 
                    });
                    if (!ref.spouses) ref.spouses = [];
                    ref.spouses.push(spouseId);
                    newNode.parents.push(spouseId);
                }
            }
            nodes.push(newNode);
        }
        renderTree();
        closeModal();
    };

    function deleteNode() {
        if (!selectedNodeId) return;
        const target = nodes.find(n => n.id === selectedNodeId);
        if (target && confirm(`Remove ${target.name}?`)) {
            const id = selectedNodeId;
            nodes = nodes.filter(n => n.id !== id);
            nodes.forEach(n => {
                n.parents = (n.parents || []).filter(pid => pid !== id);
                n.children = (n.children || []).filter(cid => cid !== id);
                n.spouses = (n.spouses || []).filter(sid => sid !== id);
            });
            selectedNodeId = null;
            renderTree();
        }
        contextMenu.classList.add('hidden');
    }

    function zoomIn() { zoom *= 1.2; updateTransform(); }
    function zoomOut() { zoom /= 1.2; updateTransform(); }
    function resetView() { zoom = 1; panX = 0; panY = 0; updateTransform(); }
</script>
</body>
</html>
