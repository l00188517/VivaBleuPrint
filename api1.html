<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Viva Gemini Career Architect</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        .step-transition { transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1); }
        .hidden { display: none; }
        .fade-in { animation: fadeIn 0.5s ease-out forwards; }
        .spinner { animation: spin 1s linear infinite; }
        @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        .option-btn { transition: all 0.2s ease; }
        .option-btn:active { transform: scale(0.98); }
    </style>
</head>
<body class="bg-slate-50 min-h-screen font-sans text-slate-900">

    <div id="app" class="flex flex-col items-center justify-center min-h-screen p-4 md:p-8">
        <!-- Progress Bar Container -->
        <div id="progress-container" class="max-w-xl w-full mb-10 flex items-center gap-2">
            <!-- Progress dots generated by JS -->
        </div>

        <!-- Question Card -->
        <div id="question-card" class="max-w-xl w-full bg-white rounded-[2rem] shadow-2xl shadow-slate-200/50 border border-slate-200 p-8 md:p-12 fade-in">
            <div id="step-indicator" class="inline-flex items-center px-3 py-1 bg-indigo-50 text-indigo-600 rounded-full text-xs font-bold uppercase tracking-wider mb-6"></div>
            <h2 id="question-text" class="text-3xl font-extrabold text-slate-900 mb-3 leading-tight"></h2>
            <p id="question-subtitle" class="text-slate-500 mb-8 text-lg"></p>

            <div id="options-container" class="space-y-4 mb-10">
                <!-- Options generated by JS -->
            </div>

            <div id="error-message" class="mb-6 p-4 bg-red-50 text-red-600 rounded-2xl text-sm border border-red-100 hidden"></div>

            <div class="flex gap-4">
                <button id="prev-btn" class="flex-1 py-4 px-6 border border-slate-200 text-slate-500 rounded-2xl font-bold hover:bg-slate-50 hover:text-slate-700 transition-all hidden">
                    <i class="fas fa-chevron-left mr-2"></i> Back
                </button>
                <button id="next-btn" class="flex- py-4 px-6 bg-indigo-600 text-white rounded-2xl font-bold hover:bg-indigo-700 active:bg-indigo-800 transition-all flex items-center justify-center disabled:bg-slate-200 disabled:text-slate-400 disabled:cursor-not-allowed shadow-lg shadow-indigo-200/50">
                    <span id="next-btn-text">Next Question</span>
                    <i class="fas fa-arrow-right ml-2" id="next-btn-icon"></i>
                </button>
            </div>
        </div>

        <!-- Result Card -->
        <div id="result-card" class="max-w-2xl w-full bg-white rounded-[2.5rem] shadow-2xl shadow-indigo-100 border border-slate-100 overflow-hidden hidden fade-in">
            <div class="bg-indigo-600 p-10 text-white text-center relative">
                <div class="absolute top-0 left-0 w-full h-full opacity-10 pointer-events-none">
                    <svg width="100%" height="100%" viewBox="0 0 100 100" preserveAspectRatio="none">
                        <path d="M0 100 C 20 0 50 0 100 100 Z" fill="white"></path>
                    </svg>
                </div>
                <i class="fas fa-award text-6xl mb-6 text-indigo-200"></i>
                <h2 class="text-sm font-bold uppercase tracking-[0.2em] text-indigo-100 mb-2">Your Professional Blueprint</h2>
                <h1 id="result-title" class="text-4xl font-black mt-2 leading-tight"></h1>
            </div>
            
            <div class="p-10 space-y-10">
                <div class="bg-indigo-50/50 p-8 rounded-[2rem] border border-indigo-100 relative overflow-hidden">
                    <div class="absolute top-4 right-4 text-indigo-200/50 text-4xl italic font-serif">"</div>
                    <h3 class="flex items-center text-indigo-900 font-black uppercase text-xs tracking-widest mb-4">
                        <i class="fas fa-compass mr-2"></i> The Strategic Why
                    </h3>
                    <p id="result-summary" class="text-indigo-900/70 text-lg leading-relaxed italic"></p>
                </div>

                <div class="grid md:grid-cols-2 gap-10">
                    <div>
                        <h3 class="flex items-center font-black text-slate-800 uppercase text-xs tracking-widest mb-6">
                            <i class="fas fa-bullseye mr-2 text-indigo-500"></i> Recommended Roles
                        </h3>
                        <ul id="result-roles" class="space-y-3"></ul>
                    </div>
                    <div>
                        <h3 class="flex items-center font-black text-slate-800 uppercase text-xs tracking-widest mb-6">
                            <i class="fas fa-rocket mr-2 text-indigo-500"></i> Competitive Skills
                        </h3>
                        <div id="result-skills" class="flex flex-wrap gap-2"></div>
                    </div>
                </div>

                <div class="pt-8 border-t border-slate-100">
                    <h3 class="flex items-center font-black text-slate-800 uppercase text-xs tracking-widest mb-3">
                        <i class="fas fa-bolt mr-2 text-amber-500"></i> Immediate Action
                    </h3>
                    <p id="result-action" class="text-slate-600 text-lg"></p>
                </div>

                <button id="restart-btn" class="w-full py-5 bg-slate-900 text-white rounded-2xl font-black hover:bg-slate-800 transition-all shadow-xl shadow-slate-200">
                    RESTART ASSESSMENT
                </button>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, collection } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // --- Configuration ---
        const apiKey = ""; 
        const GEMINI_URL = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`;
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'viva-blueprint-html';

        const QUESTIONS = [
            {
                id: 'current_situation',
                type: 'single',
                question: "What's your current situation?",
                options: [
                    { id: 'student', label: 'Student / Learning' },
                    { id: 'grad', label: 'Recent Graduate' },
                    { id: 'early_pro', label: 'Early Career (3-7 yrs)' },
                    { id: 'mid_pro', label: 'Mid-Career (8-15 yrs)' },
                    { id: 'senior_pro', label: 'Senior Professional' }
                ]
            },
            {
                id: 'strengths',
                type: 'multi',
                question: "What are your core strengths?",
                subtitle: "Select up to 3 keys that define you",
                options: [
                    { id: 'prob_solv', label: 'Problem Solving' },
                    { id: 'comm', label: 'Communication' },
                    { id: 'lead', label: 'Leadership' },
                    { id: 'creativity', label: 'Creativity' },
                    { id: 'analytical', label: 'Analytical Thinking' },
                    { id: 'tech_exp', label: 'Technical Mastery' }
                ]
            },
            {
                id: 'motivations',
                type: 'multi',
                question: "What drives you most?",
                options: [
                    { id: 'impact', label: 'Societal Impact' },
                    { id: 'finance', label: 'High Earning Potential' },
                    { id: 'creative', label: 'Creative Autonomy' },
                    { id: 'learning', label: 'Intellectual Growth' },
                    { id: 'stability', label: 'Security & Balance' }
                ]
            },
            {
                id: 'work_focus',
                type: 'single',
                question: "How do you prefer to work?",
                options: [
                    { id: 'people', label: 'Collaborating with People' },
                    { id: 'data', label: 'Analyzing Data & Facts' },
                    { id: 'ideas', label: 'Developing Concepts' },
                    { id: 'tech', label: 'Building with Technology' }
                ]
            }
        ];

        let currentStep = 0;
        let answers = {};
        let db, auth, user;

        const initApp = async () => {
            try {
                const firebaseConfig = JSON.parse(typeof __firebase_config !== 'undefined' ? __firebase_config : '{}');
                if (firebaseConfig.apiKey) {
                    const app = initializeApp(firebaseConfig);
                    auth = getAuth(app);
                    db = getFirestore(app);

                    if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                        await signInWithCustomToken(auth, __initial_auth_token);
                    } else {
                        await signInAnonymously(auth);
                    }
                    onAuthStateChanged(auth, (u) => { user = u; });
                }
            } catch (e) { console.error("Firebase init error", e); }
            render();
        };

        const render = () => {
            const q = QUESTIONS[currentStep];
            
            // Progress Bar
            const prog = document.getElementById('progress-container');
            prog.innerHTML = QUESTIONS.map((_, i) => `
                <div class="h-1.5 flex-1 rounded-full transition-all duration-500 ${i <= currentStep ? 'bg-indigo-600' : 'bg-slate-200'}"></div>
            `).join('');

            // Question Content
            document.getElementById('step-indicator').innerText = `Step ${currentStep + 1} / ${QUESTIONS.length}`;
            document.getElementById('question-text').innerText = q.question;
            document.getElementById('question-subtitle').innerText = q.subtitle || "";

            // Options
            const container = document.getElementById('options-container');
            container.innerHTML = '';
            q.options.forEach(opt => {
                const isSelected = q.type === 'multi' 
                    ? (answers[q.id] || []).includes(opt.id)
                    : answers[q.id] === opt.id;

                const btn = document.createElement('button');
                btn.className = `option-btn w-full p-5 text-left rounded-2xl border-2 transition-all flex items-center justify-between group
                    ${isSelected ? 'border-indigo-600 bg-indigo-50/50 text-indigo-900 shadow-sm' : 'border-slate-100 hover:border-slate-200 text-slate-600 hover:bg-slate-50'}`;
                
                btn.innerHTML = `
                    <span class="font-bold text-lg">${opt.label}</span>
                    <div class="w-7 h-7 rounded-full border-2 flex items-center justify-center transition-all ${isSelected ? 'bg-indigo-600 border-indigo-600 scale-110' : 'border-slate-200'}">
                        ${isSelected ? '<i class="fas fa-check text-[10px] text-white"></i>' : ''}
                    </div>
                `;

                btn.onclick = () => {
                    if (q.type === 'multi') {
                        let current = answers[q.id] || [];
                        answers[q.id] = current.includes(opt.id) ? current.filter(id => id !== opt.id) : [...current, opt.id];
                    } else {
                        answers[q.id] = opt.id;
                    }
                    render();
                };
                container.appendChild(btn);
            });

            // Buttons
            document.getElementById('prev-btn').classList.toggle('hidden', currentStep === 0);
            const nextBtn = document.getElementById('next-btn');
            const nextBtnText = document.getElementById('next-btn-text');
            
            nextBtn.disabled = !answers[q.id] || (Array.isArray(answers[q.id]) && answers[q.id].length === 0);
            nextBtnText.innerText = currentStep === QUESTIONS.length - 1 ? 'Unlock My Path' : 'Continue';
        };

        const generateResult = async () => {
            const nextBtn = document.getElementById('next-btn');
            const nextBtnText = document.getElementById('next-btn-text');
            const nextBtnIcon = document.getElementById('next-btn-icon');
            
            nextBtn.disabled = true;
            nextBtnText.innerText = "Consulting Gemini...";
            nextBtnIcon.className = "fas fa-circle-notch spinner ml-2";

            const profile = QUESTIONS.map(q => {
                const val = answers[q.id];
                const labels = q.options.filter(o => Array.isArray(val) ? val.includes(o.id) : val === o.id).map(o => o.label).join(", ");
                return `${q.question}: ${labels}`;
            }).join("\n");

            const systemPrompt = `You are a Career Architect. Analyze the user profile and return ONLY valid JSON: { "title": "Path Title", "summary": "Strategic explanation", "roles": ["Role 1", "Role 2", "Role 3"], "skills": ["Skill 1", "Skill 2"], "action_plan": "Next step" }`;

            const callAI = async (retries = 0) => {
                try {
                    const res = await fetch(GEMINI_URL, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            contents: [{ parts: [{ text: `Profile:\n${profile}` }] }],
                            systemInstruction: { parts: [{ text: systemPrompt }] },
                            generationConfig: { responseMimeType: "application/json" }
                        })
                    });
                    if (!res.ok) throw new Error();
                    const data = await res.json();
                    // Fix: Corrected path for response parsing
                    return JSON.parse(data.candidates.content.parts.text);
                } catch (e) {
                    if (retries < 4) {
                        const delay = Math.pow(2, retries) * 1000;
                        await new Promise(r => setTimeout(r, delay));
                        return callAI(retries + 1);
                    }
                    throw e;
                }
            };

            try {
                const career = await callAI();
                displayResult(career);
                if (user && db) {
                    const resRef = doc(collection(db, 'artifacts', appId, 'users', user.uid, 'results'), Date.now().toString());
                    await setDoc(resRef, { answers, career, timestamp: new Date().toISOString() });
                }
            } catch (e) {
                const err = document.getElementById('error-message');
                err.innerText = "We're having trouble connecting to the AI. Please try again in a moment.";
                err.classList.remove('hidden');
                nextBtn.disabled = false;
                nextBtnText.innerText = "Try Again";
                nextBtnIcon.className = "fas fa-arrow-right ml-2";
            }
        };

        const displayResult = (data) => {
            document.getElementById('question-card').classList.add('hidden');
            document.getElementById('progress-container').classList.add('hidden');
            const resultCard = document.getElementById('result-card');
            resultCard.classList.remove('hidden');

            document.getElementById('result-title').innerText = data.title;
            document.getElementById('result-summary').innerText = data.summary;
            document.getElementById('result-action').innerText = data.action_plan;
            
            const rolesUl = document.getElementById('result-roles');
            rolesUl.innerHTML = data.roles.map(r => `
                <li class="flex items-center text-slate-600 bg-slate-50 px-5 py-3 rounded-xl border border-slate-100 font-medium">
                    <i class="fas fa-chevron-right text-indigo-400 mr-3 text-xs"></i> ${r}
                </li>
            `).join('');

            const skillsDiv = document.getElementById('result-skills');
            skillsDiv.innerHTML = data.skills.map(s => `
                <span class="px-4 py-2 bg-white border border-slate-200 rounded-xl text-sm text-slate-700 font-bold shadow-sm">
                    ${s}
                </span>
            `).join('');
        };

        document.getElementById('next-btn').onclick = () => {
            if (currentStep < QUESTIONS.length - 1) {
                currentStep++;
                render();
            } else {
                generateResult();
            }
        };

        document.getElementById('prev-btn').onclick = () => {
            if (currentStep > 0) {
                currentStep--;
                render();
            }
        };

        document.getElementById('restart-btn').onclick = () => {
            currentStep = 0;
            answers = {};
            document.getElementById('result-card').classList.add('hidden');
            document.getElementById('question-card').classList.remove('hidden');
            document.getElementById('progress-container').classList.remove('hidden');
            document.getElementById('error-message').classList.add('hidden');
            render();
        };

        window.onload = initApp;
    </script>
</body>
</html>
