<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PortfolioVault | Global Asset Directory</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        
        :root {
            --revolut-blue: #0075eb;
            --bg-main: #f8fafc;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-main);
            color: #1e293b;
            scroll-behavior: smooth;
        }

        .revolut-blue-text { color: var(--revolut-blue); }
        .bg-revolut-blue { background-color: var(--revolut-blue); }

        .sidebar-link {
            transition: all 0.2s ease;
            border-radius: 12px;
            margin-bottom: 4px;
        }

        .sidebar-link:hover {
            background-color: #f1f5f9;
            color: var(--revolut-blue);
        }

        .sidebar-link.active {
            background-color: #eff6ff;
            color: var(--revolut-blue);
            font-weight: 700;
        }

        .card-gradient {
            background: linear-gradient(135deg, #ffffff 0%, #f8fafc 100%);
        }

        .asset-card {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .asset-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 20px -5px rgba(0, 0, 0, 0.08);
            border-color: #bfdbfe;
        }

        .sticky-sidebar {
            height: calc(100vh - 5rem);
            position: sticky;
            top: 5rem;
        }

        .highlight-badge {
            background: rgba(0, 117, 235, 0.08);
            color: var(--revolut-blue);
            font-size: 10px;
            font-weight: 800;
            padding: 4px 10px;
            border-radius: 100px;
            text-transform: uppercase;
            letter-spacing: 0.02em;
        }

        .no-scrollbar::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="antialiased">

    <nav class="sticky top-0 z-50 bg-white/80 backdrop-blur-xl border-b border-slate-200">
        <div class="max-w-full mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16 items-center">
                <div class="flex items-center gap-3 group cursor-pointer shrink-0">
                    <div class="w-9 h-9 bg-revolut-blue rounded-xl flex items-center justify-center text-white font-extrabold shadow-lg shadow-blue-200">R</div>
                    <span class="text-xl font-bold tracking-tight text-slate-900">Portfolio<span class="revolut-blue-text">Vault</span></span>
                </div>

                <div class="flex-1 max-w-xl mx-8 hidden md:block">
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 flex items-center pl-4 text-slate-400">
                            <i class="fas fa-search"></i>
                        </span>
                        <input type="text" id="assetSearch" onkeyup="filterAssets()" 
                            class="block w-full pl-11 pr-4 py-2.5 border border-slate-200 rounded-2xl bg-slate-50 focus:ring-2 focus:ring-blue-500 focus:bg-white transition-all outline-none text-sm font-medium" 
                            placeholder="Search symbols, sectors, or performers...">
                    </div>
                </div>

                <div class="flex items-center gap-4">
                    <button class="bg-slate-900 text-white px-5 py-2 rounded-full text-sm font-bold hover:bg-revolut-blue transition-all">
                        Live Data
                    </button>
                </div>
            </div>
        </div>
    </nav>

    <div class="flex">
        <!-- Sidebar -->
        <aside class="hidden lg:block w-72 bg-white border-r border-slate-200 sticky-sidebar overflow-y-auto">
            <div class="p-6">
                <p class="text-[10px] font-black text-slate-400 uppercase tracking-[0.2em] mb-6">Explore</p>
                <nav class="space-y-1">
                    <a href="#stocks" class="sidebar-link flex items-center px-4 py-3 text-slate-600 font-medium" onclick="setActive(this)">
                        <i class="fas fa-chart-line mr-3 w-5 opacity-70"></i>Stocks
                    </a>
                    <a href="#etfs" class="sidebar-link flex items-center px-4 py-3 text-slate-600 font-medium" onclick="setActive(this)">
                        <i class="fas fa-layer-group mr-3 w-5 opacity-70"></i>ETFs
                    </a>
                    <a href="#bonds" class="sidebar-link flex items-center px-4 py-3 text-slate-600 font-medium" onclick="setActive(this)">
                        <i class="fas fa-landmark mr-3 w-5 opacity-70"></i>Bonds
                    </a>
                    <a href="#cfds" class="sidebar-link flex items-center px-4 py-3 text-slate-600 font-medium" onclick="setActive(this)">
                        <i class="fas fa-bolt mr-3 w-5 opacity-70"></i>CFDs
                    </a>
                    <a href="#commodities" class="sidebar-link flex items-center px-4 py-3 text-slate-600 font-medium" onclick="setActive(this)">
                        <i class="fas fa-gem mr-3 w-5 opacity-70"></i>Commodities
                    </a>
                    <a href="#cash" class="sidebar-link flex items-center px-4 py-3 text-slate-600 font-medium" onclick="setActive(this)">
                        <i class="fas fa-wallet mr-3 w-5 opacity-70"></i>Cash/Forex
                    </a>
                </nav>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="flex-1 w-full min-h-screen">
            <div class="max-w-7xl mx-auto px-4 py-10 sm:px-8 lg:px-12">
                
                <header class="mb-16">
                    <div class="inline-flex items-center gap-2 px-3 py-1 bg-blue-50 rounded-full mb-6">
                        <span class="w-2 h-2 bg-revolut-blue rounded-full"></span>
                        <span class="text-[10px] font-bold text-revolut-blue uppercase tracking-wider">Top Performers Highlighted</span>
                    </div>
                    <h1 class="text-4xl md:text-5xl font-extrabold text-slate-900 mb-4 tracking-tight">Financial <span class="revolut-blue-text">Directory</span></h1>
                    <p class="text-slate-500 text-lg max-w-2xl leading-relaxed">Discover top performers across every category. Analysis based on current market valuations and historical dividend payouts.</p>
                </header>

                <div id="content-container"></div>
            </div>
        </main>
    </div>

    <script>
        // Enhanced mock data with performance metrics (growth is mocked based on price/volatility)
        const assetData = {
            stocks: [
                { s: "AAPL", n: "Apple Inc.", p: 185.92, d: 0.52, g: 12.5 }, { s: "MSFT", n: "Microsoft Corp.", p: 415.10, d: 0.72, g: 15.2 }, 
                { s: "GOOGL", n: "Alphabet Inc.", p: 147.60, d: 0.00, g: 10.1 }, { s: "AMZN", n: "Amazon.com Inc.", p: 178.22, d: 0.00, g: 18.5 }, 
                { s: "TSLA", n: "Tesla Inc.", p: 175.43, d: 0.00, g: -5.2 }, { s: "NVDA", n: "NVIDIA Corp.", p: 875.28, d: 0.02, g: 45.8 }, 
                { s: "META", n: "Meta Platforms", p: 494.16, d: 0.40, g: 22.4 }, { s: "BRK.B", n: "Berkshire Hathaway", p: 408.20, d: 0.00, g: 8.2 }, 
                { s: "V", n: "Visa Inc.", p: 279.15, d: 0.75, g: 6.5 }, { s: "UNH", n: "UnitedHealth Group", p: 485.40, d: 1.55, g: 4.2 },
                { s: "JPM", n: "JPMorgan Chase", p: 198.52, d: 2.12, g: 12.1 }, { s: "WMT", n: "Walmart Inc.", p: 60.23, d: 1.38, g: 9.5 }, 
                { s: "MA", n: "Mastercard Inc.", p: 472.10, d: 0.56, g: 7.2 }, { s: "JNJ", n: "Johnson & Johnson", p: 158.42, d: 3.01, g: -2.1 }, 
                { s: "PG", n: "Procter & Gamble", p: 162.15, d: 2.40, g: 3.5 }, { s: "LLY", n: "Eli Lilly & Co.", p: 755.30, d: 0.68, g: 38.2 }, 
                { s: "AVGO", n: "Broadcom Inc.", p: 1350.20, d: 1.56, g: 25.1 }, { s: "HD", n: "Home Depot Inc.", p: 385.12, d: 2.34, g: 11.4 }, 
                { s: "CVX", n: "Chevron Corp.", p: 155.60, d: 4.12, g: 2.5 }, { s: "XOM", n: "Exxon Mobil Corp.", p: 112.45, d: 3.38, g: 5.8 }
            ],
            etfs: [
                { s: "SPY", n: "SPDR S&P 500", p: 512.30, d: 1.32, g: 9.8 }, { s: "IVV", n: "iShares S&P 500", p: 514.15, d: 1.35, g: 9.9 }, 
                { s: "VOO", n: "Vanguard S&P 500", p: 470.22, d: 1.38, g: 10.0 }, { s: "QQQ", n: "Invesco QQQ Trust", p: 438.10, d: 0.58, g: 16.5 }, 
                { s: "VTI", n: "Vanguard Total Stock", p: 255.40, d: 1.40, g: 8.5 }, { s: "VEA", n: "Vanguard Dev Mkts", p: 48.92, d: 3.10, g: 4.2 }, 
                { s: "IEFA", n: "iShares MSCI EAFE", p: 72.15, d: 2.85, g: 3.5 }, { s: "VWO", n: "Vanguard Emerging", p: 41.20, d: 3.45, g: 2.1 }, 
                { s: "AGG", n: "iShares US Agg Bond", p: 97.45, d: 3.22, g: 1.2 }, { s: "BND", n: "Vanguard Total Bond", p: 72.85, d: 3.25, g: 1.1 },
                { s: "SCHD", n: "Schwab Dividend", p: 78.52, d: 3.42, g: 5.5 }, { s: "VNQ", n: "Vanguard RE ETF", p: 84.20, d: 4.10, g: -4.5 }, 
                { s: "JEPI", n: "JPM Equity Premium", p: 56.40, d: 7.80, g: 2.5 }, { s: "DGRO", n: "iShares Core Div", p: 55.20, d: 2.30, g: 11.2 },
                { s: "VYM", n: "Vanguard High Yield", p: 120.40, d: 2.95, g: 6.8 }, { s: "VIG", n: "Vanguard Apprec.", p: 182.10, d: 1.85, g: 12.1 }
            ],
            bonds: [
                { s: "UST2Y", n: "US 2-Year Treasury", p: 99.45, d: 4.85, g: 0.5 }, { s: "UST10Y", n: "US 10-Year Treasury", p: 95.10, d: 4.25, g: -1.2 }, 
                { s: "LQD", n: "iShares Corp Bond", p: 108.45, d: 4.12, g: 1.5 }, { s: "HYG", n: "iShares High Yield", p: 77.20, d: 5.85, g: 4.5 }, 
                { s: "TIP", n: "iShares TIPS Bond", p: 106.12, d: 2.15, g: 0.2 }, { s: "EMB", n: "iShares EM Bond", p: 88.22, d: 5.15, g: 3.5 }
            ],
            cfds: [
                { s: "US500", n: "S&P 500 Index", p: 5185, d: 1.35, g: 10.5 }, { s: "NAS100", n: "Nasdaq 100", p: 18240, d: 0.65, g: 18.2 }, 
                { s: "BTCUSD", n: "Bitcoin / USD", p: 68420, d: 0.00, g: 65.4 }, { s: "ETHUSD", n: "Ethereum / USD", p: 3450, d: 0.00, g: 52.1 },
                { s: "SOLUSD", n: "Solana / USD", p: 185.20, d: 0.00, g: 112.5 }, { s: "UK100", n: "FTSE 100 Index", p: 7935, d: 3.85, g: 2.5 }
            ],
            commodities: [
                { s: "XAU", n: "Gold Spot", p: 2185.40, d: 0.00, g: 12.5 }, { s: "WTI", n: "WTI Crude Oil", p: 81.45, d: 0.00, g: 8.4 }, 
                { s: "XAG", n: "Silver Spot", p: 24.52, d: 0.00, g: 15.2 }, { s: "NG", n: "Natural Gas", p: 1.78, d: 0.00, g: -22.1 }
            ],
            cash: [
                { s: "EUR/USD", n: "Euro / USD", p: 1.0852, d: 3.50, g: 1.2 }, { s: "GBP/USD", n: "British Pound", p: 1.2745, d: 4.25, g: 1.8 }
            ]
        };

        function getTopPerformers(category) {
            const assets = assetData[category] || [];
            const byDiv = [...assets].sort((a, b) => b.d - a.d).slice(0, 10).filter(a => a.d > 0);
            const byGrowth = [...assets].sort((a, b) => b.g - a.g).slice(0, 10);
            return { byDiv, byGrowth };
        }

        function renderContent() {
            const container = document.getElementById('content-container');
            let sectionsHtml = '';

            for (const key of Object.keys(assetData)) {
                const { byDiv, byGrowth } = getTopPerformers(key);
                
                sectionsHtml += `
                    <section id="${key}" class="mb-24 scroll-mt-24">
                        <div class="mb-12">
                            <h2 class="text-3xl font-extrabold text-slate-900 capitalize mb-2">${key}</h2>
                            <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mt-6">
                                <div class="bg-blue-50/50 rounded-[32px] p-6 border border-blue-100">
                                    <div class="flex items-center gap-3 mb-4">
                                        <div class="w-8 h-8 bg-blue-600 text-white rounded-lg flex items-center justify-center text-xs">
                                            <i class="fas fa-percent"></i>
                                        </div>
                                        <h3 class="font-bold text-slate-800">Top 10 Dividend Yields</h3>
                                    </div>
                                    <div class="flex flex-wrap gap-2">
                                        ${byDiv.map(a => `<span class="highlight-badge bg-white shadow-sm">${a.s}: ${a.d}%</span>`).join('')}
                                    </div>
                                </div>
                                <div class="bg-slate-50 rounded-[32px] p-6 border border-slate-200">
                                    <div class="flex items-center gap-3 mb-4">
                                        <div class="w-8 h-8 bg-slate-900 text-white rounded-lg flex items-center justify-center text-xs">
                                            <i class="fas fa-chart-line"></i>
                                        </div>
                                        <h3 class="font-bold text-slate-800">Top 10 Price Growth (YTD)</h3>
                                    </div>
                                    <div class="flex flex-wrap gap-2">
                                        ${byGrowth.map(a => `<span class="highlight-badge bg-slate-200/50 text-slate-600">${a.s}: +${a.g}%</span>`).join('')}
                                    </div>
                                </div>
                            </div>
                        </div>

                        <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 xl:grid-cols-4 gap-5">
                            ${assetData[key].map(asset => {
                                const isTopDiv = byDiv.slice(0,3).some(a => a.s === asset.s);
                                const isTopGrowth = byGrowth.slice(0,3).some(a => a.s === asset.s);

                                return `
                                <div class="asset-card card-gradient group p-6 rounded-[32px] border border-slate-200">
                                    <div class="flex items-center justify-between mb-5">
                                        <div class="flex flex-col gap-1">
                                            <span class="text-[10px] font-black text-revolut-blue bg-blue-50 px-2 py-1 rounded-lg uppercase w-fit">${asset.s}</span>
                                            ${isTopDiv ? '<span class="text-[8px] text-green-600 font-black uppercase">★ Top Yield</span>' : ''}
                                            ${isTopGrowth ? '<span class="text-[8px] text-blue-600 font-black uppercase">★ Top Growth</span>' : ''}
                                        </div>
                                        <div class="text-right">
                                            <span class="text-xs font-bold text-slate-900 block">$${asset.p.toLocaleString()}</span>
                                            <span class="text-[9px] text-slate-400 font-bold uppercase">Price</span>
                                        </div>
                                    </div>
                                    <div class="text-sm font-bold text-slate-800 line-clamp-1 mb-6">${asset.n}</div>
                                    
                                    <div class="flex items-center justify-between pt-4 border-t border-slate-100">
                                        <div class="flex flex-col">
                                            <span class="text-xs font-bold ${asset.d > 0 ? 'text-green-600' : 'text-slate-400'}">
                                                ${asset.d > 0 ? asset.d.toFixed(2) + '%' : '—'}
                                            </span>
                                            <span class="text-[9px] text-slate-400 font-bold uppercase">Div Yield</span>
                                        </div>
                                        <div class="flex flex-col text-right">
                                            <span class="text-xs font-bold ${asset.g >= 0 ? 'text-blue-600' : 'text-red-500'}">
                                                ${asset.g >= 0 ? '+' : ''}${asset.g}%
                                            </span>
                                            <span class="text-[9px] text-slate-400 font-bold uppercase">Growth</span>
                                        </div>
                                    </div>
                                </div>
                            `}).join('')}
                        </div>
                    </section>
                `;
            }
            container.innerHTML = sectionsHtml;
        }

        function filterAssets() {
            const filter = document.getElementById('assetSearch').value.toUpperCase();
            const cards = document.querySelectorAll('.asset-card');
            cards.forEach(card => {
                const text = card.textContent.toUpperCase();
                card.style.display = text.includes(filter) ? "" : "none";
            });
        }

        function setActive(el) {
            document.querySelectorAll('.sidebar-link').forEach(l => l.classList.remove('active'));
            el.classList.add('active');
        }

        window.onload = renderContent;
    </script>
</body>
</html>
