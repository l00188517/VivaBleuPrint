<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Viva Gemini Career Architect</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        .step-transition { transition: all 0.3s ease-in-out; }
        .spinner { animation: spin 1s linear infinite; }
        @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        
        .option-card.selected {
            border-color: #4f46e5;
            background-color: #f5f3ff;
            ring: 2px;
            ring-color: #4f46e5;
        }

        /* Custom scrollbar for long results */
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #f1f1f1; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #c7d2fe; border-radius: 10px; }
    </style>
</head>
<body class="bg-slate-50 min-h-screen font-sans text-slate-900">

    <div id="app" class="flex flex-col items-center justify-center min-h-screen p-4 md:p-8">
        <!-- Progress Bar Container -->
        <div id="progress-container" class="max-w-xl w-full mb-8 flex items-center gap-2">
            <!-- Progress segments generated by JS -->
        </div>

        <!-- Main Card -->
        <div id="question-card" class="max-w-xl w-full bg-white rounded-3xl shadow-xl border border-slate-200 p-8 md:p-10 step-transition">
            <div id="quiz-content">
                <div id="step-indicator" class="inline-block px-3 py-1 bg-indigo-50 text-indigo-600 rounded-full text-xs font-bold uppercase mb-4"></div>
                <h2 id="question-text" class="text-2xl font-bold text-slate-900 mb-2 leading-tight"></h2>
                <p id="question-subtitle" class="text-slate-500 mb-6"></p>

                <div id="options-container" class="space-y-3 mb-8">
                    <!-- Options generated by JS -->
                </div>

                <div id="error-message" class="mb-6 p-4 bg-red-50 text-red-600 rounded-xl text-sm border border-red-100 hidden"></div>

                <div class="flex gap-4">
                    <button id="prev-btn" class="flex-1 py-4 px-6 border border-slate-200 text-slate-600 rounded-xl font-bold hover:bg-slate-50 transition-colors hidden">
                        Back
                    </button>
                    <button id="next-btn" class="flex- py-4 px-6 bg-indigo-600 text-white rounded-xl font-bold hover:bg-indigo-700 transition-all flex items-center justify-center disabled:bg-slate-300 disabled:cursor-not-allowed shadow-lg shadow-indigo-100">
                        <span id="next-btn-text">Next Question</span>
                        <i class="fas fa-arrow-right ml-2" id="next-btn-icon"></i>
                    </button>
                </div>
            </div>

            <!-- Loading State -->
            <div id="loading-state" class="hidden py-12 flex flex-col items-center text-center">
                <div class="w-16 h-16 border-4 border-indigo-100 border-t-indigo-600 rounded-full spinner mb-6"></div>
                <h3 class="text-xl font-bold mb-2">Architecting your career path...</h3>
                <p class="text-slate-500">Gemini is analyzing your preferences and the current job market.</p>
            </div>

            <!-- Results State -->
            <div id="results-state" class="hidden">
                <div class="flex items-center justify-between mb-6">
                    <h2 class="text-2xl font-bold text-slate-900">Your Career Roadmap</h2>
                    <button onclick="location.reload()" class="text-indigo-600 font-bold text-sm hover:underline">Start Over</button>
                </div>
                <div id="results-content" class="text-slate-700 leading-relaxed max-h-[60vh] overflow-y-auto pr-4 custom-scrollbar">
                    <!-- AI Content here -->
                </div>
            </div>
        </div>
    </div>

    <script type="module">
        const apiKey = ""; // Provided by environment
        const modelName = "gemini-3-flash-preview";//"gemini-2.5-flash-preview-09-2025";

        const questions = [
            {
                id: 1,
                question: "What environment fuels you?",
                subtitle: "Choose the setting where you feel most productive.",
                options: [
                    { label: "High-paced Startup", icon: "fa-rocket", value: "startup" },
                    { label: "Stable Corporate", icon: "fa-building", value: "corporate" },
                    { label: "Remote & Flexible", icon: "fa-house-laptop", value: "remote" },
                    { label: "Creative Studio", icon: "fa-palette", value: "creative" }
                ]
            },
            {
                id: 2,
                question: "Which skill set do you prefer using?",
                subtitle: "Select the area you want to grow in most.",
                options: [
                    { label: "Analytical & Data", icon: "fa-chart-line", value: "data" },
                    { label: "Creative & Design", icon: "fa-pen-nib", value: "design" },
                    { label: "Technical & Coding", icon: "fa-code", value: "coding" },
                    { label: "Leadership & Strategy", icon: "fa-users-gear", value: "leadership" }
                ]
            },
            {
                id: 3,
                question: "What's your primary motivator?",
                subtitle: "What keeps you going on Monday morning?",
                options: [
                    { label: "Financial Growth", icon: "fa-money-bill-trend-up", value: "wealth" },
                    { label: "Social Impact", icon: "fa-earth-americas", value: "impact" },
                    { label: "Innovation", icon: "fa-lightbulb", value: "innovation" },
                    { label: "Work-Life Balance", icon: "fa-clock", value: "balance" }
                ]
            }
        ];

        let currentStep = 0;
        let answers = {};

        // DOM Elements
        const questionText = document.getElementById('question-text');
        const questionSubtitle = document.getElementById('question-subtitle');
        const optionsContainer = document.getElementById('options-container');
        const stepIndicator = document.getElementById('step-indicator');
        const nextBtn = document.getElementById('next-btn');
        const prevBtn = document.getElementById('prev-btn');
        const nextBtnText = document.getElementById('next-btn-text');
        const nextBtnIcon = document.getElementById('next-btn-icon');
        const progressContainer = document.getElementById('progress-container');
        const errorMsg = document.getElementById('error-message');
        
        const quizContent = document.getElementById('quiz-content');
        const loadingState = document.getElementById('loading-state');
        const resultsState = document.getElementById('results-state');
        const resultsContent = document.getElementById('results-content');

        function init() {
            renderProgressBar();
            renderQuestion();
            
            nextBtn.addEventListener('click', handleNext);
            prevBtn.addEventListener('click', handlePrev);
        }

        function renderProgressBar() {
            progressContainer.innerHTML = '';
            questions.forEach((_, index) => {
                const segment = document.createElement('div');
                segment.className = `h-1.5 flex-1 rounded-full transition-all duration-500 ${index <= currentStep ? 'bg-indigo-600' : 'bg-slate-200'}`;
                progressContainer.appendChild(segment);
            });
        }

        function renderQuestion() {
            const q = questions[currentStep];
            stepIndicator.textContent = `Step ${currentStep + 1} of ${questions.length}`;
            questionText.textContent = q.question;
            questionSubtitle.textContent = q.subtitle;
            
            optionsContainer.innerHTML = '';
            q.options.forEach(opt => {
                const button = document.createElement('button');
                button.className = `option-card w-full p-4 rounded-2xl border-2 border-slate-100 flex items-center gap-4 hover:border-indigo-200 transition-all text-left ${answers[q.id] === opt.value ? 'selected border-indigo-600 bg-indigo-50' : 'bg-white'}`;
                button.innerHTML = `
                    <div class="w-10 h-10 rounded-xl bg-slate-50 flex items-center justify-center text-indigo-600 group-hover:bg-indigo-100">
                        <i class="fas ${opt.icon}"></i>
                    </div>
                    <span class="font-semibold text-slate-700">${opt.label}</span>
                `;
                button.onclick = () => selectOption(q.id, opt.value);
                optionsContainer.appendChild(button);
            });

            updateNavButtons();
            renderProgressBar();
        }

        function selectOption(questionId, value) {
            answers[questionId] = value;
            renderQuestion();
        }

        function updateNavButtons() {
            prevBtn.classList.toggle('hidden', currentStep === 0);
            nextBtn.disabled = !answers[questions[currentStep].id];
            
            if (currentStep === questions.length - 1) {
                nextBtnText.textContent = "Generate Roadmap";
                nextBtnIcon.className = "fas fa-sparkles ml-2";
            } else {
                nextBtnText.textContent = "Next Question";
                nextBtnIcon.className = "fas fa-arrow-right ml-2";
            }
        }

        function handleNext() {
            if (currentStep < questions.length - 1) {
                currentStep++;
                renderQuestion();
            } else {
                generateResults();
            }
        }

        function handlePrev() {
            if (currentStep > 0) {
                currentStep--;
                renderQuestion();
            }
        }

        async function fetchGemini(prompt, retries = 5, delay = 1000) {
            const url = `https://generativelanguage.googleapis.com/v1beta/models/${modelName}:generateContent?key=${apiKey}`;
            
            const payload = {
                contents: [{ parts: [{ text: prompt }] }],
                systemInstruction: {
                    parts: [{ text: "You are a professional Career Architect. Based on the user's preferences, provide a detailed career roadmap. Include suggested job titles, top 3 skills to learn, and a brief 3-step action plan. Use Markdown for formatting. Keep it inspiring and professional." }]
                }
            };

            for (let i = 0; i < retries; i++) {
                try {
                    const response = await fetch(url, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });
                    
                    if (!response.ok) throw new Error('API request failed');
                    
                    const data = await response.json();
                    return data.candidates.content?.parts.text;
                } catch (err) {
                    if (i === retries - 1) throw err;
                    await new Promise(res => setTimeout(res, delay));
                    delay *= 2; // Exponential backoff
                }
            }
        }

        async function generateResults() {
            quizContent.classList.add('hidden');
            loadingState.classList.remove('hidden');
            errorMsg.classList.add('hidden');

            const userPrompt = `
                Generate a career roadmap for someone with these preferences:
                - Work Environment: ${answers}
                - Desired Skill Focus: ${answers}
                - Primary Motivator: ${answers}
                
                Format the response with headers and bullet points.
            `;

            try {
                const aiResponse = await fetchGemini(userPrompt);
                
                // Simple markdown-ish to HTML converter for display
                const formattedContent = aiResponse
                    .replace(/^# (.*$)/gim, '<h3 class="text-xl font-bold mt-4 mb-2">$1</h3>')
                    .replace(/^## (.*$)/gim, '<h4 class="text-lg font-semibold mt-3 mb-1">$1</h4>')
                    .replace(/^\* (.*$)/gim, '<li class="ml-4 mb-1 list-disc">$1</li>')
                    .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
                    .replace(/\n/g, '<br>');

                resultsContent.innerHTML = formattedContent;
                loadingState.classList.add('hidden');
                resultsState.classList.remove('hidden');
            } catch (error) {
                loadingState.classList.add('hidden');
                quizContent.classList.remove('hidden');
                errorMsg.textContent = "We encountered an issue connecting to Gemini. Please try again.";
                errorMsg.classList.remove('hidden');
                console.error(error);
            }
        }

        // Initialize on load
        window.onload = init;
    </script>
</body>
</html>
