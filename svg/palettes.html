<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SVG Recolor Pro | Professional Vector Editing</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8fafc;
        }
        .glass-morphism {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }
        .svg-preview-container {
            background-image: 
                linear-gradient(45deg, #e5e7eb 25%, transparent 25%), 
                linear-gradient(-45deg, #e5e7eb 25%, transparent 25%), 
                linear-gradient(45deg, transparent 75%, #e5e7eb 75%), 
                linear-gradient(-45deg, transparent 75%, #e5e7eb 75%);
            background-size: 20px 20px;
            background-position: 0 0, 0 10px, 10px -10px, -10px 0px;
        }
        #svg-display svg {
            width: 100%;
            height: 100%;
            max-height: 400px;
        }
        .color-input-wrapper {
            position: relative;
            width: 40px;
            height: 40px;
            overflow: hidden;
            border-radius: 8px;
            border: 2px solid #e2e8f0;
            transition: border-color 0.2s;
        }
        .color-input-wrapper:hover {
            border-color: #6366f1;
        }
        .color-input-wrapper input[type="color"] {
            position: absolute;
            top: -10px;
            left: -10px;
            width: 60px;
            height: 60px;
            cursor: pointer;
        }
        .dropdown:hover .dropdown-menu {
            display: block;
        }
        #color-list::-webkit-scrollbar {
            width: 6px;
        }
        #color-list::-webkit-scrollbar-thumb {
            background-color: #e2e8f0;
            border-radius: 10px;
        }
    </style>
</head>
<body class="text-slate-900">

    <header class="sticky top-0 z-50 glass-morphism border-b border-slate-200">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between items-center h-16">
                <div class="flex items-center gap-2 cursor-pointer" onclick="location.reload()">
                    <div class="bg-indigo-600 p-2 rounded-lg">
                        <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 21a4 4 0 01-4-4V5a2 2 0 012-2h4a2 2 0 012 2v12a4 4 0 01-4 4zm0 0h12a2 2 0 002-2v-4a2 2 0 00-2-2h-2.343M11 7.343l1.172-1.172a4 4 0 115.656 5.656L10 17.657"></path>
                        </svg>
                    </div>
                    <span class="text-xl font-bold tracking-tight text-slate-800">SVG Recolor <span class="text-indigo-600">Pro</span></span>
                </div>

                <nav class="hidden md:flex items-center space-x-6 text-sm font-medium text-slate-600">
                    <a href="#" class="hover:text-indigo-600 transition">Features</a>
                    <div class="relative dropdown group h-16 flex items-center">
                        <button class="flex items-center gap-1 hover:text-indigo-600 transition focus:outline-none">
                            Resources
                            <svg class="w-4 h-4 transition-transform group-hover:rotate-180" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
                        </button>
                        <div class="dropdown-menu hidden absolute top-full left-0 w-48 bg-white border border-slate-200 rounded-xl shadow-xl py-2 animate-in slide-in-from-top-2 duration-200">
                            <a href="https://svg-recolor.jorgenkh.no/" target="_blank" class="flex items-center gap-2 px-4 py-2 hover:bg-slate-50 hover:text-indigo-600 transition">
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"></path></svg>
                                Original Tool
                            </a>
                        </div>
                    </div>
                    <a href="#" class="hover:text-indigo-600 transition">API Docs</a>
                </nav>

                <button class="md:hidden p-2 text-slate-600">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16m-7 6h7"></path></svg>
                </button>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-12">
        
        <!-- Dropzone Section -->
        <div id="hero-section" class="text-center mb-12">
            <h1 class="text-4xl font-extrabold text-slate-900 sm:text-5xl mb-4 tracking-tight">
                Recolor your SVGs in seconds.
            </h1>
            <p class="text-lg text-slate-600 max-w-2xl mx-auto mb-10">
                Instantly swap colors across your vector files. Our Pro tool extracts every color layer so you can modify them repeatedly.
            </p>

            <div id="dropzone" class="relative group max-w-xl mx-auto border-2 border-dashed border-slate-300 rounded-2xl p-12 bg-white hover:border-indigo-500 hover:bg-indigo-50/30 transition-all cursor-pointer">
                <input type="file" id="file-input" class="absolute inset-0 w-full h-full opacity-0 cursor-pointer z-10" accept=".svg">
                <div class="space-y-4 pointer-events-none">
                    <div class="mx-auto w-16 h-16 bg-slate-100 rounded-full flex items-center justify-center group-hover:scale-110 transition-transform">
                        <svg class="w-8 h-8 text-slate-500 group-hover:text-indigo-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path>
                        </svg>
                    </div>
                    <div>
                        <p class="text-lg font-semibold text-slate-700">Click or drag SVG here</p>
                        <p class="text-sm text-slate-500">Fast, local, and browser-based</p>
                    </div>
                </div>
            </div>
        </div>

        <!-- Workspace -->
        <div id="editor-workspace" class="hidden grid grid-cols-1 lg:grid-cols-3 gap-8 items-start animate-in fade-in duration-500">
            <div class="lg:col-span-2 space-y-4">
                <div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
                    <div class="px-6 py-4 border-b border-slate-100 flex justify-between items-center bg-slate-50/50">
                        <h3 class="font-semibold text-slate-700">Live Preview</h3>
                        <button id="reset-btn" class="text-xs font-medium text-slate-500 hover:text-red-600 transition flex items-center gap-1">
                            <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
                            Reset Original
                        </button>
                    </div>
                    <div id="svg-display" class="svg-preview-container p-8 min-h-[400px] flex items-center justify-center"></div>
                </div>
            </div>

            <div class="space-y-6">
                <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6">
                    <div class="flex items-center justify-between mb-4">
                        <h3 class="font-bold text-slate-800 flex items-center gap-2">
                            <svg class="w-5 h-5 text-indigo-500" fill="currentColor" viewBox="0 0 20 20"><path d="M17.414 2.586a2 2 0 00-2.828 0L7 10.172V13h2.828l7.586-7.586a2 2 0 000-2.828z"></path><path fill-rule="evenodd" d="M2 6a2 2 0 012-2h4a1 1 0 010 2H4v10h10v-4a1 1 0 112 0v4a2 2 0 01-2 2H4a2 2 0 01-2-2V6z" clip-rule="evenodd"></path></svg>
                            Palette Editor
                        </h3>
                        <span id="color-count" class="text-xs bg-slate-100 text-slate-500 px-2 py-0.5 rounded-full font-medium">0 colors</span>
                    </div>
                    <div id="color-list" class="space-y-3 max-h-[400px] overflow-y-auto pr-2"></div>
                </div>

                <div class="flex flex-col gap-3">
                    <button id="download-btn" class="w-full py-4 bg-indigo-600 text-white font-bold rounded-xl shadow-lg shadow-indigo-200 hover:bg-indigo-700 transition-all flex items-center justify-center gap-2">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
                        Download SVG
                    </button>
                    <button id="new-file-btn" class="w-full py-3 bg-white text-slate-600 font-semibold border border-slate-200 rounded-xl hover:bg-slate-50 transition">
                        New Project
                    </button>
                </div>
            </div>
        </div>
    </main>

    <script>
        const fileInput = document.getElementById('file-input');
        const dropzone = document.getElementById('dropzone');
        const heroSection = document.getElementById('hero-section');
        const editorWorkspace = document.getElementById('editor-workspace');
        const svgDisplay = document.getElementById('svg-display');
        const colorList = document.getElementById('color-list');
        const colorCount = document.getElementById('color-count');
        const downloadBtn = document.getElementById('download-btn');
        const newFileBtn = document.getElementById('new-file-btn');
        const resetBtn = document.getElementById('reset-btn');

        let originalSvgContent = '';

        fileInput.addEventListener('change', handleFile);
        
        function handleFile(e) {
            const file = e.target.files[0];
            if (!file || !file.name.toLowerCase().endsWith('.svg')) return;

            const reader = new FileReader();
            reader.onload = (event) => {
                originalSvgContent = event.target.result;
                processSvg(originalSvgContent);
            };
            reader.readAsText(file);
        }

        function processSvg(svgText) {
            svgDisplay.innerHTML = svgText;
            const svgElement = svgDisplay.querySelector('svg');
            if (!svgElement) return;

            heroSection.classList.add('hidden');
            editorWorkspace.classList.remove('hidden');
            
            extractColors(svgElement);
        }

        function normalizeColor(color) {
            if (!color || color === 'none' || color === 'inherit' || color.startsWith('url')) return null;
            const temp = document.createElement('canvas').getContext('2d');
            temp.fillStyle = color;
            return temp.fillStyle; // Always returns hex or rgba standardized
        }

        function extractColors(svgElement) {
            const colors = new Set();
            const elements = svgElement.querySelectorAll('*');

            elements.forEach(el => {
                const fill = normalizeColor(el.getAttribute('fill'));
                const stroke = normalizeColor(el.getAttribute('stroke'));
                if (fill) colors.add(fill);
                if (stroke) colors.add(stroke);
                
                const style = el.getAttribute('style');
                if (style) {
                    const fillMatch = style.match(/fill:\s*([^;]+)/);
                    const strokeMatch = style.match(/stroke:\s*([^;]+)/);
                    if (fillMatch) {
                        const c = normalizeColor(fillMatch[1].trim());
                        if (c) colors.add(c);
                    }
                    if (strokeMatch) {
                        const c = normalizeColor(strokeMatch[1].trim());
                        if (c) colors.add(c);
                    }
                }
            });

            const colorArray = Array.from(colors);
            colorCount.textContent = `${colorArray.length} detected`;
            renderColorControls(colorArray);
        }

        function renderColorControls(colors) {
            colorList.innerHTML = '';
            colors.forEach(color => {
                const item = document.createElement('div');
                item.className = 'flex items-center justify-between p-3 bg-slate-50 rounded-xl border border-slate-100 group hover:border-indigo-200 transition-all';
                item.innerHTML = `
                    <div class="flex items-center gap-3">
                        <div class="color-input-wrapper shadow-sm">
                            <input type="color" value="${color}" data-current="${color}">
                        </div>
                        <span class="text-xs font-mono text-slate-500 uppercase font-medium">${color}</span>
                    </div>
                    <svg class="w-4 h-4 text-slate-300 group-hover:text-indigo-400 transition-colors" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M13 5l7 7-7 7M5 5l7 7-7 7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
                `;

                const input = item.querySelector('input');
                const label = item.querySelector('span');

                // Crucial fix: Track current color and update the data attribute so it can be changed again
                input.addEventListener('input', (e) => {
                    const previousColor = e.target.getAttribute('data-current');
                    const newColor = e.target.value;
                    
                    applyColorToSvg(previousColor, newColor);
                    
                    e.target.setAttribute('data-current', newColor);
                    label.textContent = newColor;
                });

                colorList.appendChild(item);
            });
        }

        function applyColorToSvg(oldColor, newColor) {
            const svgElement = svgDisplay.querySelector('svg');
            if (!svgElement) return;
            
            const elements = svgElement.querySelectorAll('*');
            elements.forEach(el => {
                // Check Fill
                if (normalizeColor(el.getAttribute('fill')) === oldColor) {
                    el.setAttribute('fill', newColor);
                }
                // Check Stroke
                if (normalizeColor(el.getAttribute('stroke')) === oldColor) {
                    el.setAttribute('stroke', newColor);
                }

                // Check Style attributes
                let style = el.getAttribute('style');
                if (style) {
                    const styleParts = style.split(';').map(part => {
                        const splitIdx = part.indexOf(':');
                        if (splitIdx === -1) return part;
                        const prop = part.substring(0, splitIdx).trim().toLowerCase();
                        const val = part.substring(splitIdx + 1).trim();
                        
                        if ((prop === 'fill' || prop === 'stroke') && normalizeColor(val) === oldColor) {
                            return `${prop}: ${newColor}`;
                        }
                        return part;
                    });
                    el.setAttribute('style', styleParts.join('; '));
                }
            });
        }

        downloadBtn.addEventListener('click', () => {
            const svgData = svgDisplay.innerHTML;
            const blob = new Blob([svgData], {type: 'image/svg+xml;charset=utf-8'});
            const url = URL.createObjectURL(blob);
            const link = document.createElement('a');
            link.href = url;
            link.download = 'recolored-vector.svg';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        });

        newFileBtn.addEventListener('click', () => {
            editorWorkspace.classList.add('hidden');
            heroSection.classList.remove('hidden');
            fileInput.value = '';
        });

        resetBtn.addEventListener('click', () => {
            processSvg(originalSvgContent);
        });

        ['dragenter', 'dragover'].forEach(name => {
            dropzone.addEventListener(name, (e) => {
                e.preventDefault();
                dropzone.classList.add('border-indigo-500', 'bg-indigo-50/50');
            }, false);
        });
        ['dragleave', 'drop'].forEach(name => {
            dropzone.addEventListener(name, (e) => {
                e.preventDefault();
                dropzone.classList.remove('border-indigo-500', 'bg-indigo-50/50');
            }, false);
        });
        dropzone.addEventListener('drop', (e) => {
            const dt = e.dataTransfer;
            if (dt.files.length > 0) {
                fileInput.files = dt.files;
                handleFile({ target: { files: dt.files } });
            }
        });
    </script>
</body>
</html>

<!--   

    Changed the tracking attribute from data-original to data-current.

    Inside the input event listener, the app now reads the last known color of that specific layer, 
    applies the new color to the SVG, and then updates the data-current attribute to match.

    This allows you to change the same color layer infinitely without reloading the file.


-->
