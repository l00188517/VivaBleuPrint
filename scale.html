<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PathFinder | Discover Your Career</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
        
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            overflow-x: hidden;
            background: #f8fafc;
        }

        .bg-mesh {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            background-color: #f8fafc;
            background-image: 
                radial-gradient(at 0% 0%, rgba(79, 70, 229, 0.15) 0px, transparent 50%),
                radial-gradient(at 100% 0%, rgba(236, 72, 153, 0.1) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(59, 130, 246, 0.1) 0px, transparent 50%),
                radial-gradient(at 0% 100%, rgba(168, 85, 247, 0.1) 0px, transparent 50%);
        }

        .step-container {
            display: none;
            animation: slideUpFade 0.6s cubic-bezier(0.23, 1, 0.32, 1) forwards;
        }

        .step-container.active {
            display: block;
        }

        @keyframes slideUpFade {
            from { opacity: 0; transform: translateY(30px) scale(0.98); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .progress-bar-fill {
            transition: width 0.6s cubic-bezier(0.65, 0, 0.35, 1);
            background: linear-gradient(90deg, #6366f1, #a855f7, #ec4899);
        }

        .option-card {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .option-card:hover {
            transform: scale(1.01) translateY(-2px);
        }

        .option-card.selected {
            border-color: #6366f1;
            background-color: #f5f3ff;
            box-shadow: 0 0 0 2px rgba(99, 102, 241, 0.1);
        }

        .scale-dot {
            transition: all 0.2s ease;
        }

        .scale-dot.active {
            transform: scale(1.2);
            background-color: #4f46e5;
            color: white;
            box-shadow: 0 10px 15px -3px rgba(79, 70, 229, 0.3);
        }

        .floating {
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
        }

        .loader {
            border-top-color: #6366f1;
            animation: spinner 0.8s linear infinite;
        }

        @keyframes spinner {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .btn-vibrant {
            background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%);
            transition: all 0.3s ease;
        }

        .btn-vibrant:hover:not(:disabled) {
            filter: brightness(1.1);
            transform: translateY(-2px);
            box-shadow: 0 10px 15px -3px rgba(79, 70, 229, 0.4);
        }

        .btn-vibrant:disabled {
            filter: grayscale(1);
            opacity: 0.5;
            cursor: not-allowed;
        }
    </style>
</head>
<body class="text-slate-900 selection:bg-indigo-100">
    <div class="bg-mesh"></div>

    <!-- Navigation -->
    <nav class="fixed top-0 w-full h-16 bg-white/70 backdrop-blur-xl border-b border-white/20 z-50 flex items-center justify-between px-6">
        <div class="flex items-center gap-2 font-black text-2xl tracking-tighter text-indigo-600 cursor-pointer" onclick="location.reload()">
            <div class="w-8 h-8 bg-indigo-600 rounded-lg flex items-center justify-center text-white shadow-lg shadow-indigo-200">
                <i class="fa-solid fa-rocket text-sm"></i>
            </div>
            <span>PathFinder</span>
        </div>
        <div id="quiz-progress" class="hidden flex items-center gap-4">
            <div class="w-24 md:w-48 h-2.5 bg-slate-200/50 rounded-full overflow-hidden">
                <div id="progress-fill" class="progress-bar-fill h-full" style="width: 0%"></div>
            </div>
            <span id="progress-text" class="text-xs font-bold text-slate-500 uppercase tracking-widest">1/3</span>
        </div>
    </nav>

    <main class="pt-16 max-w-2xl mx-auto px-6 flex flex-col items-center justify-center min-h-[calc(100vh-64px)]">
        
        <!-- Step 1: Landing -->
        <section id="step-landing" class="step-container active text-center space-y-10 py-12">
            <div class="inline-flex items-center gap-2 px-4 py-2 bg-white/80 border border-indigo-100 text-indigo-700 rounded-full text-xs font-bold uppercase tracking-wider shadow-sm mb-4 floating">
                <i class="fa-solid fa-sparkles text-amber-400"></i>
                Join 50,000+ career explorers
            </div>
            <h1 class="text-5xl md:text-7xl font-black tracking-tight leading-[1.1] text-slate-900">
                Design your <span class="text-transparent bg-clip-text bg-gradient-to-r from-indigo-600 via-purple-600 to-pink-600">dream life.</span>
            </h1>
            <p class="text-xl text-slate-600 max-w-md mx-auto leading-relaxed font-medium">
                The most fun way to find a career path that actually fits your vibe and personality.
            </p>
            <button onclick="startQuiz()" class="btn-vibrant w-full sm:w-auto px-10 py-5 text-white rounded-2xl font-extrabold text-xl shadow-2xl flex items-center justify-center gap-3">
                Start My Journey
                <i class="fa-solid fa-arrow-right group-hover:translate-x-1 transition-transform"></i>
            </button>
        </section>

        <!-- Step 2: Quiz -->
        <section id="step-quiz" class="step-container w-full py-12">
            <div class="space-y-8">
                <div class="space-y-3">
                    <h2 id="question-title" class="text-3xl md:text-4xl font-extrabold text-slate-900 leading-tight">Question?</h2>
                    <p id="question-subtitle" class="text-slate-500 text-xl font-medium">Subtitle</p>
                    <div id="type-badge" class="inline-block px-3 py-1 bg-indigo-100 text-indigo-600 rounded-lg text-[10px] font-black uppercase tracking-widest hidden">Select Multiple</div>
                </div>

                <!-- Card Layout (Single/Multi) -->
                <div id="options-grid" class="grid gap-4">
                    <!-- Options injected via JS -->
                </div>

                <!-- Scale Layout (Rating 1-5) -->
                <div id="scale-container" class="hidden py-8 space-y-12">
                    <div class="flex justify-between items-end px-2">
                        <span class="text-xs font-black text-slate-400 uppercase tracking-widest">Not at all</span>
                        <span class="text-xs font-black text-slate-400 uppercase tracking-widest">Extremely</span>
                    </div>
                    <div class="relative flex justify-between items-center px-4">
                        <div class="absolute top-1/2 left-0 w-full h-1 bg-slate-200 -translate-y-1/2 rounded-full z-0"></div>
                        <button onclick="handleScale(1)" class="scale-dot z-10 w-12 h-12 rounded-full bg-white border-2 border-slate-200 font-bold flex items-center justify-center hover:border-indigo-500">1</button>
                        <button onclick="handleScale(2)" class="scale-dot z-10 w-12 h-12 rounded-full bg-white border-2 border-slate-200 font-bold flex items-center justify-center hover:border-indigo-500">2</button>
                        <button onclick="handleScale(3)" class="scale-dot z-10 w-12 h-12 rounded-full bg-white border-2 border-slate-200 font-bold flex items-center justify-center hover:border-indigo-500">3</button>
                        <button onclick="handleScale(4)" class="scale-dot z-10 w-12 h-12 rounded-full bg-white border-2 border-slate-200 font-bold flex items-center justify-center hover:border-indigo-500">4</button>
                        <button onclick="handleScale(5)" class="scale-dot z-10 w-12 h-12 rounded-full bg-white border-2 border-slate-200 font-bold flex items-center justify-center hover:border-indigo-500">5</button>
                    </div>
                </div>

                <div class="flex items-center justify-between pt-4">
                    <button id="back-btn" onclick="prevQuestion()" class="flex items-center gap-2 text-slate-400 hover:text-indigo-600 font-bold transition-all px-4 py-2 rounded-xl hover:bg-white">
                        <i class="fa-solid fa-arrow-left text-sm"></i>
                        Previous
                    </button>
                    <button id="next-btn" onclick="goToNextStep()" class="hidden btn-vibrant px-8 py-4 text-white rounded-2xl font-bold flex items-center gap-2">
                        Continue
                        <i class="fa-solid fa-chevron-right text-xs"></i>
                    </button>
                </div>
            </div>
        </section>

        <!-- Step 3: Calculating -->
        <section id="step-calculating" class="step-container text-center space-y-10">
            <div class="relative w-32 h-32 mx-auto">
                <div class="loader ease-linear rounded-full border-4 border-t-4 border-slate-200 h-32 w-32"></div>
                <div class="absolute inset-0 flex items-center justify-center">
                    <i class="fa-solid fa-compass text-indigo-600 text-4xl floating"></i>
                </div>
            </div>
            <div class="space-y-3">
                <h2 class="text-3xl font-black text-slate-900">Curating your future...</h2>
                <div class="flex justify-center gap-1">
                    <div class="w-2 h-2 bg-indigo-500 rounded-full animate-bounce"></div>
                    <div class="w-2 h-2 bg-purple-500 rounded-full animate-bounce [animation-delay:0.2s]"></div>
                    <div class="w-2 h-2 bg-pink-500 rounded-full animate-bounce [animation-delay:0.4s]"></div>
                </div>
            </div>
        </section>

        <!-- Step 4: Result -->
        <section id="step-result" class="step-container w-full">
            <div class="bg-white/80 backdrop-blur-2xl rounded-[3rem] p-10 md:p-14 shadow-2xl border border-white text-center space-y-10 relative overflow-hidden">
                <div id="result-icon-bg" class="w-24 h-24 mx-auto rounded-[2rem] flex items-center justify-center text-white shadow-2xl rotate-3">
                    <i id="result-icon" class="fa-solid fa-briefcase text-4xl"></i>
                </div>
                <div class="space-y-4">
                    <div class="inline-block px-4 py-1.5 bg-indigo-50 text-indigo-600 rounded-full text-xs font-black uppercase tracking-widest">Your Match</div>
                    <h2 id="result-title" class="text-4xl md:text-5xl font-black text-slate-900">Career Title</h2>
                    <p id="result-desc" class="text-slate-500 text-lg font-medium max-w-sm mx-auto leading-relaxed"></p>
                </div>
                <div class="space-y-6 pt-6">
                    <button class="btn-vibrant w-full py-6 text-white rounded-3xl font-black text-xl shadow-xl flex items-center justify-center gap-3">
                        Claim Your Roadmap
                        <i class="fa-solid fa-star"></i>
                    </button>
                    <button onclick="location.reload()" class="w-full py-2 text-slate-400 font-bold hover:text-slate-600 transition-colors uppercase text-xs tracking-widest">
                        Start Over
                    </button>
                </div>
            </div>
        </section>

    </main>

    <script>
        /**
         * Logic Definitions
         * - 'type': 'single', 'multi', or 'scale'
         * - 'condition': logic to show/hide
         */
        const questions = [
            {
                id: 'vibe',
                type: 'single',
                question: "Which environment fuels your energy?",
                subtitle: "Where do you lose track of time?",
                options: [
                    { id: 'tech', label: 'Inside a complex code base', icon: 'fa-terminal', color: 'text-indigo-500', score: { tech: 3, data: 2 } },
                    { id: 'creative', label: 'In a creative studio with zero limits', icon: 'fa-wand-magic-sparkles', color: 'text-pink-500', score: { design: 3, marketing: 2 } },
                    { id: 'impact', label: 'Directly helping a community grow', icon: 'fa-hands-holding-heart', color: 'text-emerald-500', score: { health: 3 } }
                ]
            },
            {
                id: 'analytical_scale',
                type: 'scale',
                question: "How much do you enjoy logical puzzles?",
                subtitle: "Rating from 1 (Hate it) to 5 (Love it).",
                score: { tech: 1, data: 1.5, finance: 1 } // Scores multiplied by rating
            },
            {
                id: 'tech_specialty',
                type: 'multi',
                condition: (answers) => answers.vibe?.id === 'tech',
                question: "What parts of tech excite you most?",
                subtitle: "Select all that apply to refine your path.",
                options: [
                    { id: 'ai', label: 'Artificial Intelligence & ML', icon: 'fa-brain', color: 'text-purple-500', score: { data: 2, tech: 1 } },
                    { id: 'ui', label: 'Visual UI & Frontend', icon: 'fa-desktop', color: 'text-blue-500', score: { design: 2, tech: 1 } },
                    { id: 'security', label: 'Cybersecurity & Privacy', icon: 'fa-shield-halved', color: 'text-slate-700', score: { tech: 2 } }
                ]
            },
            {
                id: 'social_scale',
                type: 'scale',
                question: "How important is daily social interaction to you?",
                subtitle: "From solitary focus to constant collaboration.",
                score: { marketing: 1.2, health: 1.5, business: 1 }
            },
            {
                id: 'universal_goal',
                type: 'multi',
                question: "What are your top career priorities?",
                subtitle: "Pick the factors that matter most right now.",
                options: [
                    { id: 'remote', label: 'Remote-first lifestyle', icon: 'fa-wifi', color: 'text-cyan-500', score: { tech: 1, design: 1 } },
                    { id: 'salary', label: 'High earning potential', icon: 'fa-dollar-sign', color: 'text-emerald-600', score: { data: 1, business: 1 } },
                    { id: 'purpose', label: 'Social impact & purpose', icon: 'fa-seedling', color: 'text-green-500', score: { health: 2, education: 2 } }
                ]
            }
        ];

        const paths = {
            tech: { title: "Software Engineer", desc: "You're destined to build the infrastructure of the next internet generation.", icon: "fa-code", color: "bg-indigo-600" },
            design: { title: "Product Designer", desc: "You have the rare gift of making the world more beautiful and usable.", icon: "fa-palette", color: "bg-pink-600" },
            data: { title: "AI/Data Scientist", desc: "You turn messy noise into clear, actionable signals.", icon: "fa-microchip", color: "bg-emerald-600" },
            health: { title: "HealthTech Specialist", desc: "Combining care with innovation to save lives.", icon: "fa-heart-pulse", color: "bg-red-500" },
            marketing: { title: "Growth Specialist", desc: "Mastering the art of attention and human behavior.", icon: "fa-bolt", color: "bg-amber-500" },
            business: { title: "Venture Lead", desc: "Scaling ideas and leading high-impact teams.", icon: "fa-briefcase", color: "bg-purple-600" }
        };

        let activeQuestionIndex = 0;
        let userAnswers = {}; 
        let visibleQuestions = [];

        function showStep(id) {
            document.querySelectorAll('.step-container').forEach(step => step.classList.remove('active'));
            document.getElementById(`step-${id}`).classList.add('active');
            document.getElementById('quiz-progress').style.display = id === 'quiz' ? 'flex' : 'none';
        }

        function startQuiz() {
            userAnswers = {};
            calculateVisibleQuestions();
            activeQuestionIndex = 0;
            showStep('quiz');
            renderQuestion();
        }

        function calculateVisibleQuestions() {
            visibleQuestions = questions.filter(q => !q.condition || q.condition(userAnswers));
        }

        function renderQuestion() {
            const q = visibleQuestions[activeQuestionIndex];
            if (!q) return processResults();

            document.getElementById('question-title').innerText = q.question;
            document.getElementById('question-subtitle').innerText = q.subtitle;
            
            const badge = document.getElementById('type-badge');
            badge.classList.toggle('hidden', q.type === 'single' || q.type === 'scale');
            badge.innerText = q.type === 'multi' ? 'Select Multiple' : 'Rate Experience';

            // Progress Update
            const progress = ((activeQuestionIndex + 1) / visibleQuestions.length) * 100;
            document.getElementById('progress-fill').style.width = `${progress}%`;
            document.getElementById('progress-text').innerText = `${activeQuestionIndex + 1}/${visibleQuestions.length}`;

            const grid = document.getElementById('options-grid');
            const scale = document.getElementById('scale-container');
            
            if (q.type === 'scale') {
                grid.classList.add('hidden');
                scale.classList.remove('hidden');
                updateScaleUI(userAnswers[q.id]);
            } else {
                grid.classList.remove('hidden');
                scale.classList.add('hidden');
                grid.innerHTML = '';
                
                const currentSelection = userAnswers[q.id] || (q.type === 'multi' ? [] : null);
                q.options.forEach((opt) => {
                    const isSelected = q.type === 'multi' 
                        ? currentSelection.some(s => s.id === opt.id)
                        : currentSelection?.id === opt.id;

                    const btn = document.createElement('button');
                    btn.className = `option-card flex items-center gap-5 p-6 bg-white border border-slate-100 rounded-3xl text-left group ${isSelected ? 'selected' : ''}`;
                    btn.onclick = () => handleSelect(q, opt);
                    btn.innerHTML = `
                        <div class="w-12 h-12 bg-slate-50 rounded-2xl flex items-center justify-center ${opt.color} group-hover:bg-white transition-colors text-xl shadow-inner">
                            <i class="fa-solid ${opt.icon}"></i>
                        </div>
                        <div class="flex-1">
                            <span class="text-lg font-bold text-slate-700 leading-tight">${opt.label}</span>
                        </div>
                        <div class="w-6 h-6 rounded-full border-2 border-slate-200 flex items-center justify-center transition-all ${isSelected ? 'bg-indigo-600 border-indigo-600' : ''}">
                            ${isSelected ? '<i class="fa-solid fa-check text-white text-[10px]"></i>' : ''}
                        </div>
                    `;
                    grid.appendChild(btn);
                });
            }

            document.getElementById('back-btn').style.visibility = activeQuestionIndex > 0 ? 'visible' : 'hidden';
            
            // Show Next btn for Multi or if Scale is already answered
            const showNext = (q.type === 'multi' && userAnswers[q.id]?.length > 0) || (q.type === 'scale' && userAnswers[q.id] !== undefined);
            document.getElementById('next-btn').classList.toggle('hidden', !showNext);
        }

        function handleSelect(question, option) {
            if (question.type === 'single') {
                userAnswers[question.id] = option;
                calculateVisibleQuestions();
                activeQuestionIndex++;
                renderQuestion();
            } else {
                if (!userAnswers[question.id]) userAnswers[question.id] = [];
                const idx = userAnswers[question.id].findIndex(s => s.id === option.id);
                if (idx > -1) userAnswers[question.id].splice(idx, 1);
                else userAnswers[question.id].push(option);
                renderQuestion();
            }
        }

        function handleScale(rating) {
            const q = visibleQuestions[activeQuestionIndex];
            userAnswers[q.id] = rating;
            updateScaleUI(rating);
            
            // Auto-advance for scale after a short delay for feedback
            setTimeout(() => {
                goToNextStep();
            }, 300);
        }

        function updateScaleUI(rating) {
            document.querySelectorAll('.scale-dot').forEach((dot, idx) => {
                dot.classList.toggle('active', (idx + 1) === rating);
            });
        }

        function goToNextStep() {
            activeQuestionIndex++;
            calculateVisibleQuestions();
            renderQuestion();
        }

        function prevQuestion() {
            if (activeQuestionIndex > 0) {
                activeQuestionIndex--;
                renderQuestion();
            }
        }

        function processResults() {
            showStep('calculating');
            
            setTimeout(() => {
                const totalScores = {};
                
                Object.entries(userAnswers).forEach(([qId, val]) => {
                    const qDef = questions.find(q => q.id === qId);
                    
                    if (qDef.type === 'scale') {
                        // Rating 1-5 multiplier
                        Object.entries(qDef.score).forEach(([path, weight]) => {
                            totalScores[path] = (totalScores[path] || 0) + (weight * val);
                        });
                    } else {
                        const ansList = Array.isArray(val) ? val : [val];
                        ansList.forEach(ans => {
                            if (ans.score) {
                                Object.entries(ans.score).forEach(([path, weight]) => {
                                    totalScores[path] = (totalScores[path] || 0) + weight;
                                });
                            }
                        });
                    }
                });

                const winner = Object.entries(totalScores).sort((a, b) => b[1] - a[1])[0]?.[0] || 'tech';
                const result = paths[winner];

                document.getElementById('result-title').innerText = result.title;
                document.getElementById('result-desc').innerText = result.desc;
                document.getElementById('result-icon').className = `fa-solid ${result.icon} text-4xl`;
                document.getElementById('result-icon-bg').className = `w-24 h-24 mx-auto rounded-[2rem] flex items-center justify-center text-white shadow-2xl rotate-3 ${result.color}`;
                
                showStep('result');
            }, 2500);
        }
    </script>
</body>
</html>
