<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Viva Gemini Career Architect</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        .step-transition { transition: all 0.3s ease-in-out; }
        .hidden { display: none; }
        .spinner { animation: spin 1s linear infinite; }
        @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    </style>
</head>
<body class="bg-slate-50 min-h-screen font-sans">

    <div id="app" class="flex flex-col items-center justify-center min-h-screen p-4">
        <!-- Progress Bar Container -->
        <div id="progress-container" class="max-w-xl w-full mb-8 flex items-center gap-2">
            <!-- Progress dots generated by JS -->
        </div>

        <!-- Question Card -->
        <div id="question-card" class="max-w-xl w-full bg-white rounded-3xl shadow-lg border border-slate-200 p-8 md:p-10">
            <div id="step-indicator" class="inline-block px-3 py-1 bg-indigo-50 text-indigo-600 rounded-full text-xs font-bold uppercase mb-4"></div>
            <h2 id="question-text" class="text-2xl font-bold text-slate-900 mb-2"></h2>
            <p id="question-subtitle" class="text-slate-500 mb-6"></p>

            <div id="options-container" class="space-y-3 mb-8">
                <!-- Options generated by JS -->
            </div>

            <div id="error-message" class="mb-6 p-4 bg-red-50 text-red-600 rounded-xl text-sm border border-red-100 hidden"></div>

            <div class="flex gap-4">
                <button id="prev-btn" class="flex-1 py-4 px-6 border border-slate-200 text-slate-600 rounded-xl font-bold hover:bg-slate-50 disabled:opacity-50 hidden">Back</button>
                <button id="next-btn" class="flex- py-4 px-6 bg-indigo-600 text-white rounded-xl font-bold hover:bg-indigo-700 transition-all flex items-center justify-center disabled:bg-slate-300 disabled:cursor-not-allowed shadow-lg shadow-indigo-200">
                    <span id="next-btn-text">Next Question</span>
                    <i class="fas fa-arrow-right ml-2" id="next-btn-icon"></i>
                </button>
            </div>
        </div>

        <!-- Result Card -->
        <div id="result-card" class="max-w-2xl w-full bg-white rounded-3xl shadow-xl border border-slate-100 overflow-hidden hidden">
            <div class="bg-indigo-600 p-8 text-white text-center">
                <i class="fas fa-award text-5xl mb-4 opacity-90"></i>
                <h2 class="text-sm font-bold uppercase tracking-widest opacity-80">Your Career Architect Result</h2>
                <h1 id="result-title" class="text-3xl font-extrabold mt-2"></h1>
            </div>
            
            <div class="p-8 space-y-8">
                <div class="bg-indigo-50 p-6 rounded-2xl border border-indigo-100">
                    <h3 class="flex items-center text-indigo-900 font-bold mb-2">
                        <i class="fas fa-compass mr-2"></i> Why this path?
                    </h3>
                    <p id="result-summary" class="text-indigo-800/80 leading-relaxed"></p>
                </div>

                <div class="grid md:grid-cols-2 gap-6">
                    <div>
                        <h3 class="flex items-center font-bold text-slate-800 mb-4">
                            <i class="fas fa-bullseye mr-2 text-indigo-500"></i> Target Roles
                        </h3>
                        <ul id="result-roles" class="space-y-2"></ul>
                    </div>
                    <div>
                        <h3 class="flex items-center font-bold text-slate-800 mb-4">
                            <i class="fas fa-book-open mr-2 text-indigo-500"></i> Skills to Master
                        </h3>
                        <div id="result-skills" class="flex flex-wrap gap-2"></div>
                    </div>
                </div>

                <div class="pt-6 border-t border-slate-100">
                    <h3 class="flex items-center font-bold text-slate-800 mb-2">
                        <i class="fas fa-bolt mr-2 text-amber-500"></i> Immediate Next Step
                    </h3>
                    <p id="result-action" class="text-slate-600 italic"></p>
                </div>

                <button id="restart-btn" class="w-full py-4 bg-slate-900 text-white rounded-xl font-bold hover:bg-slate-800 transition-colors">
                    Start New Assessment
                </button>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, collection } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // --- Configuration ---
        const apiKey = ""; // Provided at runtime
        const GEMINI_URL = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`;
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'viva-blueprint-html';

        const QUESTIONS = [
            {
                id: 'current_situation',
                type: 'single',
                question: "What best describes your current situation?",
                options: [
                    { id: 'student', label: 'Student' },
                    { id: 'grad', label: 'Recent graduate (0–2 years)' },
                    { id: 'early_pro', label: 'Early career professional (3–7 years)' },
                    { id: 'mid_pro', label: 'Mid-career professional (8–15 years)' },
                    { id: 'senior_pro', label: 'Senior professional (15+ years)' }
                ]
            },
            {
                id: 'strengths',
                type: 'multi',
                question: "Which strengths best describe you?",
                subtitle: "Select your top 3",
                options: [
                    { id: 'prob_solv', label: 'Problem solving' },
                    { id: 'comm', label: 'Communication' },
                    { id: 'lead', label: 'Leadership' },
                    { id: 'creativity', label: 'Creativity' },
                    { id: 'analytical', label: 'Analytical thinking' },
                    { id: 'tech_exp', label: 'Technical expertise' }
                ]
            },
            {
                id: 'motivations',
                type: 'multi',
                question: "What motivates you most at work?",
                options: [
                    { id: 'impact', label: 'Making an impact' },
                    { id: 'finance', label: 'Financial rewards' },
                    { id: 'creative', label: 'Creative freedom' },
                    { id: 'learning', label: 'Constant learning' },
                    { id: 'stability', label: 'Stability & Security' }
                ]
            },
            {
                id: 'work_focus',
                type: 'single',
                question: "What type of work do you prefer most?",
                options: [
                    { id: 'people', label: 'Working with people' },
                    { id: 'data', label: 'Working with data' },
                    { id: 'ideas', label: 'Working with ideas' },
                    { id: 'tech', label: 'Working with technology' }
                ]
            }
        ];

        let currentStep = 0;
        let answers = {};
        let db, auth, user;

        // --- Init Firebase ---
        const initApp = async () => {
            try {
                const firebaseConfig = JSON.parse(typeof __firebase_config !== 'undefined' ? __firebase_config : '{}');
                if (firebaseConfig.apiKey) {
                    const app = initializeApp(firebaseConfig);
                    auth = getAuth(app);
                    db = getFirestore(app);

                    if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                        await signInWithCustomToken(auth, __initial_auth_token);
                    } else {
                        await signInAnonymously(auth);
                    }
                    onAuthStateChanged(auth, (u) => { user = u; });
                }
            } catch (e) { console.error("Firebase init error", e); }
            render();
        };

        // --- Logic ---
        const render = () => {
            const q = QUESTIONS[currentStep];
            
            // Progress Bar
            const prog = document.getElementById('progress-container');
            prog.innerHTML = QUESTIONS.map((_, i) => `
                <div class="h-2 flex-1 rounded-full ${i <= currentStep ? 'bg-indigo-600' : 'bg-slate-200'}"></div>
            `).join('');

            // Question Content
            document.getElementById('step-indicator').innerText = `Question ${currentStep + 1} of ${QUESTIONS.length}`;
            document.getElementById('question-text').innerText = q.question;
            document.getElementById('question-subtitle').innerText = q.subtitle || "";

            // Options
            const container = document.getElementById('options-container');
            container.innerHTML = '';
            q.options.forEach(opt => {
                const isSelected = q.type === 'multi' 
                    ? (answers[q.id] || []).includes(opt.id)
                    : answers[q.id] === opt.id;

                const btn = document.createElement('button');
                btn.className = `w-full p-4 text-left rounded-xl border-2 transition-all flex items-center justify-between group
                    ${isSelected ? 'border-indigo-600 bg-indigo-50 text-indigo-900' : 'border-slate-100 hover:border-slate-300 text-slate-700'}`;
                
                btn.innerHTML = `
                    <span class="font-medium">${opt.label}</span>
                    <div class="w-6 h-6 rounded-full border-2 flex items-center justify-center ${isSelected ? 'bg-indigo-600 border-indigo-600' : 'border-slate-200'}">
                        ${isSelected ? '<i class="fas fa-chevron-right text-xs text-white"></i>' : ''}
                    </div>
                `;

                btn.onclick = () => {
                    if (q.type === 'multi') {
                        let current = answers[q.id] || [];
                        answers[q.id] = current.includes(opt.id) ? current.filter(id => id !== opt.id) : [...current, opt.id];
                    } else {
                        answers[q.id] = opt.id;
                    }
                    render();
                };
                container.appendChild(btn);
            });

            // Buttons
            document.getElementById('prev-btn').classList.toggle('hidden', currentStep === 0);
            const nextBtn = document.getElementById('next-btn');
            const nextBtnText = document.getElementById('next-btn-text');
            
            nextBtn.disabled = !answers[q.id] || (Array.isArray(answers[q.id]) && answers[q.id].length === 0);
            nextBtnText.innerText = currentStep === QUESTIONS.length - 1 ? 'See Your Results' : 'Next Question';
        };

        const generateResult = async () => {
            const nextBtn = document.getElementById('next-btn');
            const nextBtnText = document.getElementById('next-btn-text');
            const nextBtnIcon = document.getElementById('next-btn-icon');
            
            nextBtn.disabled = true;
            nextBtnText.innerText = "Analyzing Blueprint...";
            nextBtnIcon.className = "fas fa-spinner spinner ml-2";

            const profile = QUESTIONS.map(q => {
                const val = answers[q.id];
                const labels = q.options.filter(o => Array.isArray(val) ? val.includes(o.id) : val === o.id).map(o => o.label).join(", ");
                return `${q.question}: ${labels}`;
            }).join("\n");

            const systemPrompt = `Analyze user profile and return ONLY JSON: { "title": "Path", "summary": "Why", "roles": ["R1"], "skills": ["S1"], "action_plan": "Next step" }`;

            const callAI = async (retries = 0) => {
                try {
                    const res = await fetch(GEMINI_URL, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            contents: [{ parts: [{ text: `Profile:\n${profile}` }] }],
                            systemInstruction: { parts: [{ text: systemPrompt }] },
                            generationConfig: { responseMimeType: "application/json" }
                        })
                    });
                    if (!res.ok) throw new Error();
                    const data = await res.json();
                    return JSON.parse(data.candidates.content.parts.text);
                } catch (e) {
                    if (retries < 3) {
                        await new Promise(r => setTimeout(r, 2000));
                        return callAI(retries + 1);
                    }
                    throw e;
                }
            };

            try {
                const career = await callAI();
                displayResult(career);
                if (user && db) {
                    await setDoc(doc(collection(db, 'artifacts', appId, 'users', user.uid, 'results'), Date.now().toString()), { answers, career, timestamp: new Date().toISOString() });
                }
            } catch (e) {
                const err = document.getElementById('error-message');
                err.innerText = "Connection issue. Please check your internet and try again.";
                err.classList.remove('hidden');
                nextBtn.disabled = false;
                nextBtnText.innerText = "Try Again";
                nextBtnIcon.className = "fas fa-arrow-right ml-2";
                console.log(`Exception while doing something: ${e}`);
            }
        };

        const displayResult = (data) => {
            document.getElementById('question-card').classList.add('hidden');
            document.getElementById('progress-container').classList.add('hidden');
            const resultCard = document.getElementById('result-card');
            resultCard.classList.remove('hidden');

            document.getElementById('result-title').innerText = data.title;
            document.getElementById('result-summary').innerText = data.summary;
            document.getElementById('result-action').innerText = `"${data.action_plan}"`;
            
            const rolesUl = document.getElementById('result-roles');
            rolesUl.innerHTML = data.roles.map(r => `<li class="flex items-center text-slate-600 bg-slate-50 px-4 py-2 rounded-lg border border-slate-100"><i class="fas fa-chevron-right text-indigo-400 mr-2 text-xs"></i> ${r}</li>`).join('');

            const skillsDiv = document.getElementById('result-skills');
            skillsDiv.innerHTML = data.skills.map(s => `<span class="px-3 py-1 bg-white border border-slate-200 rounded-full text-sm text-slate-600 font-medium">${s}</span>`).join('');
        };

        // --- Event Listeners ---
        document.getElementById('next-btn').onclick = () => {
            if (currentStep < QUESTIONS.length - 1) {
                currentStep++;
                render();
            } else {
                generateResult();
            }
        };

        document.getElementById('prev-btn').onclick = () => {
            if (currentStep > 0) {
                currentStep--;
                render();
            }
        };

        document.getElementById('restart-btn').onclick = () => {
            currentStep = 0;
            answers = {};
            document.getElementById('result-card').classList.add('hidden');
            document.getElementById('question-card').classList.remove('hidden');
            document.getElementById('progress-container').classList.remove('hidden');
            render();
        };

        window.onload = initApp;
    </script>
</body>
</html>
